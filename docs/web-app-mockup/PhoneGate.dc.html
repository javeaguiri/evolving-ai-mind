<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone budget grid</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0D6A6A}a:hover{color:#094F4F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F5F7; color: #15191E; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.5">
<div style="padding: 12px 16px; background: #FFFFFF; border-bottom: 1px solid #DCE0E5; display: flex; align-items: center; gap: 8px">
<a href="#" style="min-height: 44px; display: flex; align-items: center; text-decoration: none; font-weight: 500">← Back</a>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #586170">manage_budget · run 931</span>
</div>
<div style="flex: 1 1 auto; overflow: hidden; padding: 14px 12px 0">
<div style="background: #FFFFFF; border: 1px solid #DCE0E5; border-radius: 12px; overflow: hidden">
<div style="padding: 14px 14px 6px">
<div style="font-size: 17px; font-weight: 600">Budget editor — October 2026</div>
<div style="font-size: 13px; color: #3A424C">Income €4,400.00 · Non-discretionary €1,945.00 · Discretionary €560.00 · Savings €400.00</div>
<div style="font-size: 13px; margin-top: 2px"><strong>Net cash flow:</strong> €1,495.00</div>
</div>
<table style="width: 100%; border-collapse: collapse; font-size: 14px">
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
<tbody>
<tr><td colspan="2" style="padding: 8px 14px; background: #F4F5F7; font-weight: 600; color: #3A424C; border-top: 1px solid #DCE0E5">{{g.label}}</td></tr>
<sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="3">
<tr>
<td style="padding: 6px 14px; border-top: 1px solid #EDF0F2">{{r.name}}</td>
<td style="padding: 4px 10px 4px 0; border-top: 1px solid #EDF0F2; width: 132px"><input aria-label="{{ r.aria }}" inputmode="decimal" value="{{ r.value }}" readonly style="width: 100%; box-sizing: border-box; min-height: 40px; padding: 0 10px; border: 1px solid #DCE0E5; border-radius: 8px; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 15px; background: {{ r.bg }}"></td>
</tr>
</sc-for>
</tbody>
</sc-for>
</table>
</div>
</div>
<div style="padding: 12px 16px 24px; background: #FFFFFF; border-top: 1px solid #DCE0E5; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="font-size: 14px; color: #3A424C">2 changes</span>
<div style="display: flex; gap: 8px">
<button style="min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #C9CFD6; background: #FFFFFF; font: inherit; font-weight: 500">Cancel</button>
<button style="min-height: 44px; padding: 0 20px; border-radius: 10px; border: 0; background: #0D6A6A; color: #FFFFFF; font: inherit; font-weight: 500">Save</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const row = (name, value, changed) => ({ name: name, value: value, aria: 'Amount — ' + name, bg: changed ? '#FFF3C4' : '#FFFFFF' });
    return {
      groups: [
        { label: 'Income', rows: [row('Salary', '3800.00'), row('Freelance work', '600.00')] },
        { label: 'Non-discretionary', rows: [row('Mortgage', '1150.00'), row('Utilities', '180.00'), row('Insurance', '95.00'), row('Groceries', '560,00', true)] },
        { label: 'Discretionary', rows: [row('Dining out', '120.00', true), row('Leisure', '120.00'), row('Clothing', '80.00'), row('Travel', '200.00')] }
      ]
    };
  }
}
</script>
</body>
</html>
