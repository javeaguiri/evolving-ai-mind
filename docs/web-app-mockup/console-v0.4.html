<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Brain mock-up v0.4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: arch-home-brain's console — navigator left, page of panels centre, Novia right; a mock toolbar above it. */
:root{
  --ink:#15191E; --muted:#586170; --line:#DCE0E5; --soft:#EEF1F4; --paper:#FFFFFF; --ground:#F4F5F7;
  --accent:#0D6A6A; --accent-ink:#0A5555; --accent-soft:#E3F1F0;
  --warn:#9A3412; --warn-soft:#FFF3C4; --bad:#B42318; --bad-soft:#FDECEA; --slack:#4A154B;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#D9DDE2;color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* mock toolbar — not part of the product */
.mockbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:8px 16px;background:#1F2429;color:#E6E9EC;font-size:13px}
.mockbar b{font-weight:600}
.seg{display:inline-flex;border:1px solid #4A525B;border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:#C9CFD6;padding:4px 10px}
.seg button[aria-pressed="true"]{background:#E6E9EC;color:#15191E;font-weight:600}
.mockbar .hint{color:#9AA3AD}
.mockbar a{color:#9FD8D3}

.stage{flex:1 1 auto;min-height:0;display:flex;justify-content:center;align-items:stretch;padding:0}
.app{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;background:var(--ground);position:relative;overflow:hidden}
.stage.is-phone{padding:16px;align-items:center}
.stage.is-phone .app{flex:0 0 390px;height:min(844px,100%);border-radius:28px;border:8px solid #15191E;box-shadow:0 10px 40px rgba(0,0,0,.25)}

/* header */
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.crumb{color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd{flex:1 1 auto;max-width:420px;margin-left:auto;position:relative}
.cmd input{width:100%;min-height:38px;padding:6px 12px 6px 34px;border:1px solid #C9CFD6;border-radius:10px;background:var(--ground)}
.cmd svg{position:absolute;left:10px;top:10px}
.cmd .tip{position:absolute;top:42px;left:0;right:0;z-index:5}
.icons{display:flex;gap:6px;margin-left:auto}
.cmd + .icons{margin-left:0}
.ib{position:relative;width:40px;height:40px;border-radius:999px;border:1px solid #C9CFD6;background:var(--paper);display:inline-flex;align-items:center;justify-content:center;color:#3A424C}
.ib:hover{background:var(--soft)}
.ib .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}

.body{flex:1 1 auto;min-height:0;display:flex}
.nav{flex:0 0 210px;background:var(--paper);border-right:1px solid var(--line);padding:12px 8px;overflow:auto}
.nav h3{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px;font-weight:600}
.nav button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:8px;color:#2A3038}
.nav button:hover{background:var(--soft)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav .add{color:var(--accent-ink)}
.main{flex:1 1 auto;min-width:0;overflow:auto;padding:18px 20px 40px}
.pagehead{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.pagehead h1{font-size:20px;font-weight:600}
.pagehead .sub{color:var(--muted)}
.pagehead .acts{margin-left:auto;display:flex;gap:8px}

.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;align-items:start}
.w2{grid-column:span 2}.w3{grid-column:span 3}.w4{grid-column:span 4}.w6{grid-column:span 6}
@media (max-width:1100px){.w2{grid-column:span 3}.w4{grid-column:span 6}}
.is-phone .grid{grid-template-columns:minmax(0,1fr)}
.is-phone .w2,.is-phone .w3,.is-phone .w4,.is-phone .w6{grid-column:auto}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel.flash{box-shadow:0 0 0 3px var(--accent)}
.phead{display:flex;align-items:center;gap:8px}
.phead h2{font-size:15px;font-weight:600;flex:1 1 auto;min-width:0}
.kind{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--muted);font-weight:500;white-space:nowrap}
.kind.wf{background:#E8EEFB;color:#2F4A8A}.kind.nv{background:#F3E8F6;color:#6B2C7A}
.info{width:26px;height:26px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-weight:700}
.info:hover{background:var(--soft);color:var(--accent-ink)}
.pop{padding:9px 11px;border-radius:8px;background:var(--ink);color:#F4F5F7;font-size:12.5px}
.pop a{color:#9FD8D3}
.foot{font-size:12px;color:var(--muted)}
.editbar{display:flex;gap:6px;align-items:center;padding:6px;border:1px dashed #AEB6BF;border-radius:8px;background:var(--ground)}
.editbar select{padding:2px 4px}
.addtile{grid-column:span 6;min-height:64px;border:2px dashed #AEB6BF;border-radius:12px;background:transparent;color:var(--accent-ink);font-weight:600}
.addtile:hover{background:var(--paper)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 14px;border-radius:8px;border:1px solid #C9CFD6;background:var(--paper);font-weight:500}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#094F4F}
.btn.quiet{border-color:transparent;background:transparent}
.btn.sm{min-height:30px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}

.runs{display:flex;flex-direction:column}
.runrow{display:flex;align-items:center;gap:8px;padding:7px 4px;border:0;border-top:1px solid var(--soft);background:transparent;text-align:left;width:100%}
.runrow:hover{background:var(--ground)}
.runrow .lbl{flex:1 1 auto;font-weight:500}
.pill{font-size:11px;padding:1px 7px;border-radius:999px;font-weight:600}
.pill.wait{background:var(--warn-soft);color:var(--warn)}.pill.done{background:var(--soft);color:var(--muted)}.pill.slack{background:#F1E6F1;color:var(--slack)}.pill.run{background:var(--accent-soft);color:var(--accent-ink)}
.empty{color:var(--muted);padding:6px 0}

/* run thread */
.thread{display:flex;flex-direction:column;gap:10px;border-left:3px solid var(--accent-soft);padding-left:12px}
.msg{background:var(--ground);border-radius:8px;padding:9px 11px}
.msg table{border-collapse:collapse;margin-top:6px}
.msg td,.msg th{padding:3px 10px 3px 0;text-align:left}
.msg th{color:var(--muted);font-weight:500}
.gate{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.gate .q{font-weight:600}
.answered{font-size:13px;color:var(--muted);padding:2px 0}
.answered b{color:var(--ink);font-weight:600}
.working{font-size:13px;color:var(--accent-ink)}
.choice label{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:8px}
.choice label:hover{background:var(--ground)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btnrow .count{color:var(--muted);font-size:13px;margin-right:auto}

table.g{border-collapse:collapse;width:100%}
table.g th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
table.g td{padding:2px 8px;border-bottom:1px solid var(--soft)}
table.g tr.grp td{background:var(--ground);font-weight:600;font-size:12.5px;padding:6px 8px}
table.g .r{text-align:right}
.cell{width:100%;min-height:32px;padding:4px 8px;border:1px solid transparent;border-radius:6px;background:transparent;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.cell.txt{text-align:left;font-family:var(--sans)}
.cell:hover{border-color:#C9CFD6;background:#fff}
.cell:focus{outline:2px solid var(--accent);outline-offset:-1px;background:#fff}
.cell.changed{background:var(--warn-soft)}
.cell.bad{background:var(--bad-soft);border-color:var(--bad)}
.errline{color:var(--bad);font-size:12px}
.tablewrap{overflow-x:auto}
details.slackview{font-size:13px}
details.slackview summary{cursor:pointer;color:var(--slack);font-weight:500}
.slackbox{margin-top:8px;border:1px solid #D9C7DA;border-left:4px solid var(--slack);border-radius:6px;padding:10px;background:#FBF8FB}
.slackbox .opt{display:inline-block;margin:3px 4px 0 0;padding:3px 9px;border:1px solid #C9CFD6;border-radius:4px;background:#fff}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart .bar{cursor:pointer}
.chart .bar rect.b{fill:var(--accent)}
.chart .bar:hover rect.b,.chart .bar:focus rect.b{fill:#094F4F}
.chart text{fill:var(--ink);font-size:12px;font-family:var(--sans)}
.chart text.v{font-family:var(--mono);fill:var(--muted)}
.metric .big{font-size:28px;font-weight:600}
.meter{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.list .li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--soft)}
.list .li span:last-child{color:var(--muted)}
.report{background:var(--ground);border-radius:8px;padding:10px 12px}
.report ul{margin:4px 0 0;padding-left:18px}

/* Novia */
.novia{flex:0 0 300px;background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.novia.closed{flex:0 0 44px}
.novia .nh{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.novia .nh h2{font-size:14px;flex:1 1 auto}
.sessions{display:flex;flex-direction:column;padding:6px;border-bottom:1px solid var(--line)}
.sessions button{border:0;background:transparent;text-align:left;padding:6px 8px;border-radius:8px;display:flex;justify-content:space-between;gap:8px}
.sessions button:hover{background:var(--soft)}
.sessions button[aria-current="true"]{background:#F3E8F6;color:#4E1F59;font-weight:600}
.convo{flex:1 1 auto;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.bub{padding:8px 10px;border-radius:10px;max-width:92%}
.bub.me{align-self:flex-end;background:var(--accent-soft)}
.bub.nv{align-self:flex-start;background:var(--ground)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #C9CFD6;background:#fff;border-radius:999px;padding:3px 10px;font-size:12.5px}
.compose{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
.compose input{flex:1 1 auto;min-height:36px;padding:6px 10px;border:1px solid #C9CFD6;border-radius:8px}
.vlabel{writing-mode:vertical-rl;transform:rotate(180deg);margin:10px auto;color:#6B2C7A;font-weight:600;border:0;background:transparent}

/* drawers and modals */
.scrim{position:absolute;inset:0;background:rgba(21,25,30,.35);z-index:20;display:flex;justify-content:flex-end}
.drawer{width:min(560px,100%);height:100%;background:var(--paper);display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h2{font-size:16px;flex:1 1 auto}
.drawer .db{flex:1 1 auto;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.scrim.center{justify-content:center;align-items:center}
.modal{width:min(720px,94%);max-height:90%;background:var(--paper);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal .db{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.steps{display:flex;gap:6px;font-size:12px;color:var(--muted)}
.steps span{padding:2px 8px;border-radius:999px;background:var(--soft)}
.steps span.on{background:var(--accent);color:#fff}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.opt{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;text-align:left;display:flex;flex-direction:column;gap:3px}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.opt small{color:var(--muted)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 16px}
.tabs button{border:0;background:transparent;padding:10px 10px;border-bottom:3px solid transparent;color:#3A424C;font-weight:500}
.tabs button[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--accent-ink);font-weight:600}
.settings{display:flex;min-height:340px}
.settings nav{flex:0 0 180px;border-right:1px solid var(--line);padding:8px}
.settings nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px}
.settings nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.settings .pane{flex:1 1 auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:12.5px;color:var(--muted);font-weight:500}
.fld input,.fld select{min-height:36px;padding:6px 10px;border:1px solid #C9CFD6;border-radius:8px;background:#fff}
.term{border-bottom:1px dotted var(--muted)}
.toast{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;z-index:40;font-size:13px}
.p0note{background:#FFF8E1;border:1px solid #F0D98C;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:14px}
.hidden-p0{}
dl.words{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:0}
dl.words dt{font-weight:600}dl.words dd{margin:0;color:#2A3038}

/* phone */
.tabbar{display:none}
.is-phone .nav,.is-phone .cmd{display:none}
.is-phone .novia{display:none}
.is-phone .tabbar{display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border-top:1px solid var(--line);padding-bottom:10px}
.tabbar button{border:0;background:transparent;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--muted);gap:2px}
.tabbar button[aria-current="true"]{color:var(--accent-ink);font-weight:600}
.is-phone .main{padding:14px 14px 30px}
.is-phone .top{padding:10px 12px}
.is-phone .crumb{display:none}
.is-phone .drawer{width:100%}
.sheetnav button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--soft);background:transparent;padding:12px 4px;font-size:15px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="mockbar" role="region" aria-label="Mock-up controls">
  <b>Home Brain web app · mock-up v0.4</b>
  <span>Phase <span class="seg" id="seg-phase"><button data-act="phase" data-v="P0">P0</button><button data-act="phase" data-v="P1">P1</button></span></span>
  <span>View <span class="seg" id="seg-view"><button data-act="view" data-v="desktop">Desktop</button><button data-act="view" data-v="phone">Phone</button></span></span>
  <span class="hint">Try: Edit the budget · click a bar · ↻ Refresh · 🔔 · Edit page → + Add panel · Novia's suggestion · 🧠 · ⚙. All names and amounts are invented.</span>
</div>
<div class="stage" id="stage"><div class="app" id="app"></div></div>

<script>
'use strict';
const euro = n => '€' + n.toLocaleString('en-GB', {minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- invented sample data ---------- */
const DOMAINS = {
  inventory: {label:'Inventory', tables:['PGD_InventoryItem','running_low (view)'], schedules:['Weekly stock check · Mondays 08:00']},
  budget:    {label:'Budget', tables:['PGD_Budget','budget_vs_spent (view)'], schedules:[]},
  expenses:  {label:'Expenses', tables:['PGD_Expenses','spend_by_category (view)'], schedules:[]},
  recipes:   {label:'Recipes', tables:['PGD_Recipe','PGD_RecipeIngredient'], schedules:[]},
};
const WF = {
  manage_budget:    {label:'Edit the budget', domain:'budget', desc:'One month’s amounts in a grid'},
  process_receipt:  {label:'Process a receipt', domain:'expenses', desc:'Turn a receipt into expense lines'},
  manage_expenses:  {label:'Manage expenses', domain:'expenses', desc:'Add, edit or delete an expense'},
  manage_inventory: {label:'Manage inventory', domain:'inventory', desc:'Count stock and build the grocery list'},
  review_inventory: {label:'Review inventory', domain:'inventory', desc:'Find and merge duplicate items'},
  plan_meals:       {label:'Plan meals', domain:'recipes', desc:'A week of dinners from your recipes'},
};
const SOURCES = [
  {id:'PGD_Expenses', label:'Expenses', domain:'expenses', type:'table', numeric:true},
  {id:'spend_by_category', label:'Spending by category', domain:'expenses', type:'view', numeric:true},
  {id:'budget_vs_spent', label:'Budget vs spent', domain:'budget', type:'view', numeric:true},
  {id:'PGD_InventoryItem', label:'Inventory items', domain:'inventory', type:'table', numeric:true},
  {id:'running_low', label:'Running low', domain:'inventory', type:'view', numeric:true},
  {id:'recipe', label:'Recipes', domain:'recipes', type:'entity', numeric:false},
  {id:'out:manage_inventory', label:'Grocery list', domain:'inventory', type:'output', wf:'manage_inventory'},
  {id:'out:manage_budget', label:'Budget summary', domain:'budget', type:'output', wf:'manage_budget'},
];
const WIDGETS = {
  table:{label:'Table', desc:'A grid, editable where allowed'},
  form:{label:'Form', desc:'One record, children inline'},
  list:{label:'List', desc:'Compact rows'},
  chart:{label:'Chart', desc:'Bars, line or pie; click through'},
  metric:{label:'Metric', desc:'One number against another'},
  report:{label:'Report', desc:'A workflow’s latest output; Refresh re-runs it'},
};
function widgetsFor(src){
  if (src.type==='output') return ['report'];
  if (src.type==='entity') return ['form','list'];
  return ['table','list'].concat(src.numeric ? ['chart','metric'] : []);
}
const EXPENSES = [
  {id:301,date:'02 Oct',merchant:'Mercadona',category:'Groceries',amount:84.20},
  {id:302,date:'05 Oct',merchant:'Renfe',category:'Transport',amount:42.00},
  {id:303,date:'07 Oct',merchant:'Lidl',category:'Groceries',amount:56.35},
  {id:304,date:'09 Oct',merchant:'Zara',category:'Clothing',amount:86.00},
  {id:305,date:'11 Oct',merchant:'Pharmacy',category:'Household',amount:18.40},
  {id:306,date:'12 Oct',merchant:'Burger King',category:'Eating out',amount:23.90},
  {id:307,date:'14 Oct',merchant:'Repsol',category:'Transport',amount:61.00},
  {id:308,date:'17 Oct',merchant:'Mercadona',category:'Groceries',amount:112.75},
  {id:309,date:'19 Oct',merchant:'La Tasca',category:'Eating out',amount:72.10},
  {id:310,date:'21 Oct',merchant:'Leroy Merlin',category:'Household',amount:39.60},
  {id:311,date:'24 Oct',merchant:'Lidl',category:'Groceries',amount:58.70},
  {id:312,date:'26 Oct',merchant:'Metro',category:'Transport',amount:37.00},
];
const INVENTORY = [
  {item:'Olive oil', qty:'1 bottle', reorder:'2', low:true},
  {item:'Coffee beans', qty:'250 g', reorder:'500 g', low:true},
  {item:'Dish soap', qty:'1', reorder:'2', low:true},
  {item:'Milk', qty:'3 L', reorder:'4 L', low:true},
  {item:'Rice', qty:'2 kg', reorder:'1 kg', low:false},
  {item:'Pasta', qty:'4 packs', reorder:'2', low:false},
];
const BUDGET = [
  {group:'Monthly', id:17, cat:'Groceries', amt:400},
  {group:'Monthly', id:18, cat:'Transport', amt:150},
  {group:'Monthly', id:19, cat:'Eating out', amt:120},
  {group:'Monthly', id:20, cat:'Household', amt:80},
  {group:'Monthly', id:21, cat:'Clothing', amt:80},

/* ---------- a run, stepped through as in Slack ---------- */
function runView(r){
  const head = r.host === 'drawer' ? '' : `<div class="btnrow"><span class="count">${esc(r.label)}</span><button class="btn sm quiet" data-act="expand" data-v="${r.id}" aria-label="Open as a page">⤢ Open</button></div>`;
  return `${head}<div class="thread">${r.thread.map((s, i) => step(r, s, i)).join('')}${r.status==='running' ? '<div class="working">Working…</div>' : ''}</div>
    ${r.status==='completed' && r.host!=='drawer' ? `<div class="btnrow"><button class="btn sm" data-act="closerun" data-v="${r.id}">Done</button></div>` : ''}`;
}
function step(r, s, i){
  if (s.t === 'msg') return `<div class="msg">${s.html}</div>`;
  if (s.t === 'answered') return `<div class="answered">${s.html}</div>`;
  const live = i === r.thread.length - 1 && r.status === 'waiting';
  if (!live) return '';
  if (s.kind === 'confirm') return `<div class="gate"><div class="q">${s.q}</div><div class="btnrow">${s.actions.map((a,j) => `<button class="btn ${j===0?'primary':''}" data-act="answer" data-v="${r.id}" data-a="${esc(a)}">${esc(a)}</button>`).join('')}</div></div>`;
  if (s.kind === 'choice') return `<form class="gate choice" data-form="choice" data-v="${r.id}"><div class="q">${s.q}</div>${s.options.map((o,j) => `<label><input type="radio" name="c" value="${esc(o)}" ${j===0?'checked':''}> ${esc(o)}</label>`).join('')}<div class="btnrow"><button class="btn primary" type="submit">Continue</button><button class="btn" type="button" data-act="answer" data-v="${r.id}" data-a="Cancel">Cancel</button></div></form>`;
  if (s.kind === 'text') return `<form class="gate" data-form="text" data-v="${r.id}"><div class="q">${s.q}</div><div class="fld"><label for="tx-${r.id}">Receipt text</label><textarea id="tx-${r.id}" rows="4" style="padding:8px;border:1px solid #C9CFD6;border-radius:8px">LIDL 31/10  Bananas 1,89  Yoghurt 2,45  Bread 1,20 …</textarea></div><div class="btnrow"><button class="btn primary" type="submit">Submit</button></div></form>`;
  if (s.kind === 'grid') return gridGate(r, s);
}
function gridGate(r, s){
  let grp = null, rows = '';
  s.rows.forEach(b => {
    if (b.group !== grp){ grp = b.group; rows += `<tr class="grp"><td colspan="2">${grp}</td></tr>`; }

  });
  const n = Object.keys(s.values).length;
  return `<div class="gate"><div class="q">${s.q}</div>
    <div class="tablewrap"><table class="g"><thead><tr><th>Category</th><th class="r">Amount (€)</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="btnrow"><span class="count" id="grid-count-${r.id}">${n ? `${n} change${n>1?'s':''}` : 'No changes yet'}</span><button class="btn" data-act="answer" data-v="${r.id}" data-a="Cancel">Cancel</button><button class="btn primary" data-act="gridsave" data-v="${r.id}">Save</button></div>

  </div>`;
}

const SCRIPTS = {

    if (last.kind === 'choice'){ r.month = a; r.thread.push({t:'answered', html:`You chose <b>${esc(a)}</b>`}); r.label = `${a.split(' ')[0]} · editing`;
      return later(r, () => r.thread.push({t:'gate', kind:'grid', q:`${esc(a)} — change any amounts, then Save`, rows:BUDGET, values:{}, bad:{}})); }
    if (last.kind === 'grid'){ const ch = Object.entries(last.values);
      r.thread.push({t:'answered', html:`You chose <b>Save</b> · ${ch.length} change${ch.length===1?'':'s'}`});
      return later(r, () => { r.thread.push({t:'msg', html: ch.length ? `Saved ${ch.length} change${ch.length>1?'s':''} to ${esc(r.month)}’s budget — only the changed rows were written.<table><tr><th>Category</th><th>Was</th><th>Now</th></tr>${ch.map(([id,v]) => { const b = BUDGET.find(x=>x.id==id); return `<tr><td>${esc(b.cat)}</td><td class="num">${euro(b.amt)}</td><td class="num">${euro(parseNum(v))}</td></tr>`; }).join('')}</table>` : 'No changes, so nothing was written.'});
        r.status='completed'; r.label = `${r.month.split(' ')[0]} · ${ch.length} edit${ch.length===1?'':'s'}`; }, true); }

  manage_inventory(r, a){

      return later(r, () => { r.thread.push({t:'msg', html:'Counted 24 items; 5 are at or below their reorder level.'}); r.thread.push({t:'gate', kind:'confirm', q:'Use these counts for the grocery list?', actions:['Confirm','Cancel']}); }); }

      r.thread.push({t:'msg', html}); r.status='completed'; OUTPUTS.manage_inventory = {when: today(), run: r.label, html}; toast('Grocery list updated on the page.'); }, true);
  },

    later(r, () => { r.thread.push({t:'msg', html:'Added 6 lines from Lidl, €23.40.'}); r.status='completed'; r.label = 'Lidl · ' + today(); }, true);
  },
  review_inventory(r, a){
    r.thread.push({t:'answered', html:`You chose <b>${esc(a)}</b>`});
    later(r, () => { r.thread.push({t:'msg', html: a==='Merge' ? 'Merged. “Bread” now has 4 in stock and the alias “Bread, sliced”.' : 'Kept both items.'}); r.status='completed'; }, true);

function today(){ return '31 Oct'; }
function parseNum(v){ const t = String(v).trim().replace(/\s/g,''); if (!/^-?\d+([.,]\d{1,2})?$/.test(t)) return NaN; return Number(t.replace(',', '.')); }
function later(r, fn, finishes){ r.status = 'running'; render(); setTimeout(() => { fn(); if (!finishes && r.status==='running') r.status = 'waiting'; render(); }, 650); }
function startRun(wf, host){

  if (a.kind === 'data'){ const s = SOURCES.find(x=>x.id===a.source); return {id, kind:'data', w:a.w || (a.widget==='table'?'w6':'w3'), title:a.title || s.label, source:s.id, widget:a.widget, by:'you, 31 Oct'}; }
  if (a.kind === 'workflow'){ const dom = a.wf.startsWith('domain:') ? a.wf.slice(7) : null;
    return {id, kind:'workflow', w:a.w || 'w3', title:a.title || (dom ? DOMAINS[dom].label + ' workflows' : WF[a.wf].label), workflow: dom ? null : a.wf, domain: dom, by:'you, 31 Oct'}; }
  return {id, kind:'novia', w:a.w || 'w3', title:a.title || 'Novia · ' + a.topic, topic:a.topic, by:'you, 31 Oct'};
}

/* ---------- top-level render ---------- */
function render(){
  document.getElementById('stage').classList.toggle('is-phone', S.phone);
  document.querySelectorAll('#seg-phase button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S.phase));
  document.querySelectorAll('#seg-view button').forEach(b => b.setAttribute('aria-pressed', (b.dataset.v === 'phone') === S.phone));
  const r = S.route;
  if (p0() && (r.startsWith('act-') || (S.pages[r] && r !== 'home'))) S.route = 'home';
  const fullRun = S.route.startsWith('run-') ? RUNS.find(x => x.id == S.route.slice(4)) : null;
  const main = fullRun ? '' : S.route.startsWith('d-') ? domainPage(S.route.slice(2)) : S.route.startsWith('act-') ? activityPage(S.route.slice(4)) : householdPage(S.route);
  document.getElementById('app').innerHTML = `${header()}
    <div class="body">${navigator()}<main class="main" id="main">${fullRun ? `<div class="pagehead"><h1>${esc(fullRun.label)}</h1><span class="sub">${WF[fullRun.wf].label}</span><div class="acts"><button class="btn sm" data-act="go" data-v="home">Back</button></div></div><div class="panel">${runView(Object.assign({}, fullRun, {host:'drawer'}))}</div>` : main}</main>${noviaRegion()}</div>
    <nav class="tabbar" aria-label="Sections"><button data-act="sheet" data-v="pages" aria-current="${!!S.pages[S.route]}">Pages</button><button data-act="sheet" data-v="domains" aria-current="${S.route.startsWith('d-')}">Domains</button>${p0() ? '<button disabled>Novia · P1</button>' : '<button data-act="phonenovia">Novia</button>'}</nav>
    ${overlay()}
    ${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ''}`;
}
function toast(t){ S.toast = t; render(); clearTimeout(toast.h); toast.h = setTimeout(() => { S.toast = null; render(); }, 2200); }
function flash(id){ S.flash = id; setTimeout(() => { S.flash = null; render(); }, 1600); }
function findPanel(id){ for (const k in S.pages){ const i = S.pages[k].panels.findIndex(p => p.id === id); if (i >= 0) return [k, i]; } return []; }

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'scrim' && e.target.closest('[data-stop]')) return;
  const v = el.dataset.v, act = el.dataset.act;
  if (el.tagName === 'A') e.preventDefault();
  const A = {
    phase(){ S.phase = v; S.editing = false; S.overlay = null; },
    view(){ S.phone = v === 'phone'; S.overlay = null; },
    go(){ S.route = v; S.overlay = null; S.editing = false; location.hash = v; },
    bell(){ S.overlay = {type:'bell'}; },
    help(){ S.overlay = {type:'help'}; },
    helptab(){ S.helpTab = v; },
    settings(){ S.overlay = {type:'settings'}; },
    settab(){ S.settingsTab = v; },
    close(){ S.overlay = null; }, scrim(){ S.overlay = null; },
    pop(){ S.pops[v] = !S.pops[v]; },
    start(){ startRun(v, el.dataset.host || 'drawer'); return true; },
    openrun(){ S.overlay = {type:'run', id:+v}; },
    expand(){ const r = RUNS.find(x=>x.id==v); S.route = 'run-' + v; S.overlay = null; },
    closerun(){ const r = RUNS.find(x=>x.id==v); r.host = null; },
    answer(){ const r = RUNS.find(x=>x.id==v); SCRIPTS[r.wf](r, el.dataset.a); return true; },
    gridsave(){ const r = RUNS.find(x=>x.id==v); const g = r.thread[r.thread.length-1]; if (Object.keys(g.bad).length){ toast('Fix the outlined amounts first — nothing was sent.'); return true; } SCRIPTS[r.wf](r, 'Save'); return true; },
    refresh(){ const [k,i] = findPanel(v); const p = S.pages[k].panels[i]; const s = SOURCES.find(x=>x.id===p.source); startRun(s.wf, 'drawer'); return true; },
    drill(){ S.overlay = {type:'drill', v}; },
    novia(){ S.noviaOpen = !S.noviaOpen; },
    opensession(){ S.noviaSession = v; S.noviaOpen = true; if (S.phone) S.overlay = {type:'phonenovia'}; },
    newsession(){ const s = {id:'s'+Date.now(), topic: v || '', when:'now', msgs:[{me:false, text: v ? `New session on ${v}. What would you like to look at?` : 'What would you like to look at?'}]}; SESSIONS.unshift(s); S.noviaSession = s.id; S.noviaOpen = true; if (S.phone) S.overlay = {type:'phonenovia'}; },
    asknovia(){ const [k,i] = findPanel(v); const t = k ? S.pages[k].panels[i].title : 'this panel'; const s = {id:'s'+Date.now(), topic:'', when:'now', msgs:[{me:true, text:`About the panel “${t}” on ${k ? S.pages[k].title : 'this page'}:`},{me:false, text:'I have its configuration and source. What would you like changed?'}]}; SESSIONS.unshift(s); S.noviaSession = s.id; S.noviaOpen = true; S.pops = {}; },
    suggest(){ const s = SESSIONS.find(x=>x.id==='s1'); s.proposed = true; s.msgs.push({me:true, text:'Put the supplies running low on my home page'}); s.msgs.push({me:false, text:'Here is the change. Nothing is written until you approve it.'}); s.msgs.push({gate:true}); },
    approvepage(){ const s = SESSIONS.find(x=>x.id==='s1'); s.msgs[s.msgs.length-1].done = 'You chose <b>Approve</b> · Home is now version 4'; const p = {id:'p5', kind:'data', w:'w2', title:'Running low', source:'running_low', widget:'list', by:'Novia, 31 Oct'}; S.pages.home.panels.push(p); S.route = 'home'; flash('p5'); },
    rejectpage(){ const s = SESSIONS.find(x=>x.id==='s1'); s.msgs[s.msgs.length-1].done = 'You chose <b>Cancel</b> · nothing changed'; },
    edit(){ S.editing = true; }, editdone(){ S.editing = false; },
    mv(){ const [k,i] = findPanel(v); const a = S.pages[k].panels; const j = i + (+el.dataset.d); [a[i], a[j]] = [a[j], a[i]]; },
    rm(){ const [k,i] = findPanel(v); S.pages[k].panels.splice(i,1); },
    addpanel(){ S.add = {step:0}; S.overlay = {type:'add'}; },
    addkind(){ S.add = {step:1, kind:v}; },
    addsrc(){ S.add.source = v; S.add.step = 2; const ok = widgetsFor(SOURCES.find(x=>x.id===v)); if (ok.length === 1){ S.add.widget = ok[0]; S.add.step = 3; } },
    addwidget(){ S.add.widget = v; S.add.step = 3; },
    addwf(){ S.add.wf = v; S.add.step = 2; },
    addtopic(){ S.add.topic = v; S.add.step = 2; },
    addback(){ S.add.step--; if (S.add.kind==='data' && S.add.step===2 && widgetsFor(SOURCES.find(x=>x.id===S.add.source)).length===1) S.add.step = 1; },
    addfinish(){ const p = draftPanel(); S.pages[S.route].panels.push(p); S.overlay = null; S.editing = false; flash(p.id); },
    newpage(){ const k = 'page' + Object.keys(S.pages).length; S.pages[k] = {title:'New page', panels:[]}; S.route = k; S.editing = true; S.add = {step:0}; S.overlay = {type:'add'}; },
    copypage(){ const d = DOMAINS[v]; const k = 'copy-' + v; S.pages[k] = {title:d.label, panels:[{id:'c'+Date.now(), kind:'workflow', w:'w6', title:d.label+' workflows', domain:v, by:'you, 31 Oct'}].concat(SOURCES.filter(s=>s.domain===v && s.type!=='output').map((s,i)=>({id:'c'+i+Date.now(), kind:'data', w:'w3', title:s.label, source:s.id, widget: s.type==='entity'?'form':s.type==='view'?'list':'table', by:'you, 31 Oct'})))}; S.route = k; toast(`Copied ${d.label} to a page of your own — rearrange it with Edit page.`); },
    expsave(){ const n = Object.keys(S.expEdits).length; if (!n){ toast('Nothing to save.'); return true; } Object.entries(S.expEdits).forEach(([key,val]) => { const [id,col] = key.split(':'); const e = EXPENSES.find(x=>x.id==id); e[col] = col==='amount' ? parseNum(val) : val; }); S.expEdits = {}; toast(`Saved ${n} change${n>1?'s':''} — one write, only the changed rows.`); return true; },
    expreset(){ S.expEdits = {}; },
    toast(){ toast(v); S.overlay = null; return true; },
    sheet(){ S.overlay = {type:'sheet', v}; },
    phonenovia(){ S.overlay = {type:'phonenovia'}; },
  };
  if (A[act]){ const done = A[act](); if (!done) render(); }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('g[data-act]')){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', {bubbles:true})); }
  if (e.key === 'Escape' && S.overlay){ S.overlay = null; render(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.grid){ const [rid, bid] = t.dataset.grid.split(':'); const r = RUNS.find(x=>x.id==rid); const g = r.thread[r.thread.length-1]; const b = BUDGET.find(x=>x.id==bid);
    const n = parseNum(t.value);
    if (Number.isNaN(n)){ g.bad[bid] = 'A number, e.g. 412,50'; } else { delete g.bad[bid]; }
    if (!Number.isNaN(n) && n === b.amt) delete g.values[bid]; else g.values[bid] = t.value;
    t.classList.toggle('bad', !!g.bad[bid]); t.classList.toggle('changed', g.values[bid] !== undefined && !g.bad[bid]);
    const c = Object.keys(g.values).length; const el = document.getElementById('grid-count-'+rid); if (el) el.textContent = c ? `${c} change${c>1?'s':''}` : 'No changes yet';
  }
  if (t.dataset.exp){ const [id,col] = t.dataset.exp.split(':'); const e0 = EXPENSES.find(x=>x.id==id); const orig = col==='amount' ? e0.amount.toFixed(2) : e0.merchant;
    if (t.value === orig) delete S.expEdits[t.dataset.exp]; else S.expEdits[t.dataset.exp] = t.value;
    t.classList.toggle('changed', S.expEdits[t.dataset.exp] !== undefined);
    const c = Object.keys(S.expEdits).length; const el = document.getElementById('exp-count'); if (el) el.textContent = c ? `${c} change${c>1?'s':''}` : 'Edit a cell to change it';
  }
});
document.addEventListener('focusout', e => { if (e.target.dataset.grid){ const [rid] = e.target.dataset.grid.split(':'); const r = RUNS.find(x=>x.id==rid); const g = r.thread[r.thread.length-1]; const bid = e.target.dataset.grid.split(':')[1]; if (g.bad[bid]) render(); } });
document.addEventListener('change', e => {
  const t = e.target, c = t.dataset.chg; if (!c) return;
  if (c === 'width'){ const [k,i] = findPanel(t.dataset.v); S.pages[k].panels[i].w = t.value; render(); }
  if (c === 'recipe'){ S.recipeIx = +t.value; render(); }
  if (c === 'addtitle'){ S.add.title = t.value; }
  if (c === 'addw'){ S.add.w = t.value; render(); }
});
document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target, kind = f.dataset.form;
  if (kind === 'choice'){ const r = RUNS.find(x=>x.id==f.dataset.v); SCRIPTS[r.wf](r, new FormData(f).get('c')); }
  if (kind === 'text'){ const r = RUNS.find(x=>x.id==f.dataset.v); SCRIPTS[r.wf](r, 'text'); }
  if (kind === 'cmd'){ const q = f.querySelector('input').value.toLowerCase().trim();
    const hit = Object.entries(WF).find(([,w]) => q && w.label.toLowerCase().split(' ').some(word => word.length > 3 && q.includes(word)));
    if (hit){ S.cmdTip = null; startRun(hit[0], 'drawer'); }
    else { S.cmdTip = 'No workflow matched. Try “edit the budget” or “process a receipt” — or ask Novia in her panel.'; render(); setTimeout(() => { S.cmdTip = null; render(); }, 3000); } }
  if (kind === 'novia'){ const inp = f.querySelector('input'); const txt = inp.value.trim(); if (!txt) return;
    const s = SESSIONS.find(x=>x.id===S.noviaSession); s.msgs.push({me:true, text:txt});
    if (/running low|home page/i.test(txt) && s.id==='s1' && !s.proposed){ s.proposed = true; s.msgs.push({me:false, text:'Here is the change. Nothing is written until you approve it.'}, {gate:true}); }
    else s.msgs.push({me:false, text:'In the real app I would answer here. In this mock-up, try the suggestion in the Shopping list session.'});
    render(); }
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== S.route && (S.pages[h] || h.startsWith('d-') || h.startsWith('act-'))){ S.route = h; render(); } });
(() => { const h = location.hash.slice(1); if (h && (S.pages[h] || (h.startsWith('d-') && DOMAINS[h.slice(2)]) || h.startsWith('act-'))) S.route = h; render(); })();
</script>
