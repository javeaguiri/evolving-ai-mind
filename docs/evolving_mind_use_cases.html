<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>evolving-mind-ai — Use Case Explorer</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f8f7f4;
  --bg2: #ffffff;
  --text: #1a1a18;
  --text2: #5a5a56;
  --text3: #9a9a94;
  --border: rgba(0,0,0,0.10);
  --border2: rgba(0,0,0,0.18);
  --font: system-ui, -apple-system, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1a;
    --bg2: #252523;
    --text: #e8e6de;
    --text2: #9c9a92;
    --text3: #6b6965;
    --border: rgba(255,255,255,0.09);
    --border2: rgba(255,255,255,0.18);
  }
}

body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }

.header {
  background: var(--text); color: var(--bg);
  padding: 24px 32px; display: flex; align-items: flex-end;
  justify-content: space-between; gap: 16px; flex-wrap: wrap;
}
.header h1 { font-size: 18px; font-weight: 500; }
.header p { font-size: 13px; opacity: 0.5; margin-top: 3px; }
.header-stats { display: flex; gap: 24px; }
.stat-num { font-size: 22px; font-weight: 500; }
.stat-label { font-size: 11px; opacity: 0.45; }

.controls {
  display: flex; align-items: center; gap: 0;
  padding: 0 32px; background: var(--bg2);
  border-bottom: 0.5px solid var(--border2); flex-wrap: wrap;
}
.search-wrap {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 0; flex-shrink: 0; min-width: 200px;
}
.search-wrap input {
  border: none; background: transparent; font-family: var(--font);
  font-size: 14px; color: var(--text); outline: none; width: 180px;
}
.search-wrap input::placeholder { color: var(--text3); }
.divider { width: 0.5px; height: 20px; background: var(--border2); margin: 0 16px; flex-shrink: 0; }
.filter-bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 0; }
.ftag {
  font-size: 12px; padding: 3px 10px; border-radius: 6px;
  border: 0.5px solid var(--border2); background: transparent;
  color: var(--text2); cursor: pointer; font-family: var(--font);
  transition: all .12s;
}
.ftag:hover { background: var(--bg); }
.ftag.active { background: var(--text); color: var(--bg); border-color: transparent; }

.main { padding: 24px 32px; }

.legend { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
.leg { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); }
.leg-dot { width: 10px; height: 10px; border-radius: 2px; }

.discipline { margin-bottom: 28px; }
.disc-head {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 10px; padding-bottom: 8px;
  border-bottom: 0.5px solid var(--border2);
}
.disc-name { font-size: 15px; font-weight: 500; }
.disc-badge { font-size: 11px; padding: 2px 8px; border-radius: 5px; }
.disc-count { font-size: 12px; color: var(--text3); margin-left: auto; }

.cases { display: flex; flex-direction: column; gap: 6px; }
.card {
  background: var(--bg2); border: 0.5px solid var(--border);
  border-radius: 10px; overflow: hidden; transition: border-color .12s;
}
.card:hover { border-color: var(--border2); }
.card-head {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 14px; cursor: pointer; user-select: none;
}
.case-id { font-size: 11px; font-weight: 500; color: var(--text3); min-width: 20px; }
.case-title { font-size: 13px; font-weight: 500; flex: 1; }
.pills { display: flex; gap: 5px; }
.pill { font-size: 11px; padding: 2px 7px; border-radius: 4px; }
.p-llm { background: #fef3c7; color: #92400e; }
.p-api { background: #dbeafe; color: #1e40af; }
.p-crud { background: #d1fae5; color: #065f46; }
.p-wf { background: #f1f0ec; color: #4b5563; }
@media (prefers-color-scheme: dark) {
  .p-llm { background: #451a0333; color: #fbbf24; }
  .p-api { background: #1e3a5f33; color: #60a5fa; }
  .p-crud { background: #06402033; color: #34d399; }
  .p-wf { background: #33332e; color: #9ca3af; }
}
.chev { font-size: 9px; color: var(--text3); transition: transform .18s; display: inline-block; }
.chev.open { transform: rotate(90deg); }
.card-body { display: none; padding: 0 14px 12px; }
.card-body.open { display: block; }
.wf-label { font-size: 10px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 5px; }
.wf-steps { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; margin-bottom: 8px; }
.wf-step { font-size: 11px; padding: 2px 7px; background: var(--bg); border-radius: 4px; color: var(--text2); }
.wf-arr { font-size: 10px; color: var(--text3); }
.case-note { font-size: 12px; color: var(--text2); line-height: 1.6; padding-top: 6px; border-top: 0.5px solid var(--border); }
.no-results { text-align: center; padding: 48px 0; color: var(--text3); font-size: 14px; }

@media (max-width: 600px) {
  .header, .controls, .main { padding-left: 16px; padding-right: 16px; }
  .pills { display: none; }
  .header-stats { display: none; }
}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>evolving-mind-ai &mdash; use case explorer</h1>
    <p>Workflow patterns across disciplines &middot; Phase 2 reference</p>
  </div>
  <div class="header-stats">
    <div class="stat"><div class="stat-num">10</div><div class="stat-label">disciplines</div></div>
    <div class="stat"><div class="stat-num">60</div><div class="stat-label">use cases</div></div>
  </div>
</div>

<div class="controls">
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.2"/><path d="M9.5 9.5L12 12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
    <input type="text" id="search" placeholder="Search use cases..." oninput="render()">
  </div>
  <div class="divider"></div>
  <div class="filter-bar" id="filters"></div>
</div>

<div class="main">
  <div class="legend">
    <div class="leg"><div class="leg-dot" style="background:#fbbf24"></div><span>LLM call</span></div>
    <div class="leg"><div class="leg-dot" style="background:#60a5fa"></div><span>External API</span></div>
    <div class="leg"><div class="leg-dot" style="background:#34d399"></div><span>CRUD only</span></div>
    <div class="leg"><div class="leg-dot" style="background:#9ca3af"></div><span>Multi-step</span></div>
  </div>
  <div id="content"></div>
</div>

<script>

  { id:"household", name:"General household", tag:"Personal", color:"#639922", cases:[

      note:"LLM gets quantitative metrics and qualitative survey data and produces a structured report." },
    { id:"E", title:"Event logistics checklist", types:["crud"],
      steps:["serv_query event_template checklist","serv_query venue and catering confirmations","js_transform flag unconfirmed items","notify outstanding actions"],
      note:"No LLM. Template-driven checklist. The checklist template is a domain table seeded at event creation." },
    { id:"F", title:"Budget variance tracking", types:["crud"],
      steps:["serv_query actual_spend by budget_line","serv_query approved_budget","js_transform compute variance %","notify lines above 10% variance"],
      note:"No LLM. Standard budget vs actuals. Useful as a weekly recurring workflow notifying the finance lead." }
  ]}
];

var TYPE_PILL  = { llm:"p-llm", api:"p-api", crud:"p-crud", wf:"p-wf" };
var TYPE_LABEL = { llm:"LLM", api:"API", crud:"CRUD", wf:"workflow" };

var activeTags = new Set();
var openCards  = new Set();

function toggleTag(t) {
  if (activeTags.has(t)) { activeTags.delete(t); } else { activeTags.add(t); }
  render();
}

function toggleCard(id) {
  if (openCards.has(id)) { openCards.delete(id); } else { openCards.add(id); }
  render();
}

function buildSteps(steps) {
  var parts = [];
  for (var i = 0; i < steps.length; i++) {
    parts.push('<span class="wf-step">' + steps[i] + '</span>');
    if (i < steps.length - 1) { parts.push('<span class="wf-arr">&#8594;</span>'); }
  }
  return parts.join('');
}

function buildPills(types) {
  return types.map(function(t) {
    return '<span class="pill ' + TYPE_PILL[t] + '">' + TYPE_LABEL[t] + '</span>';
  }).join('');
}

function render() {
  var q = document.getElementById('search').value.toLowerCase();
  var allTags = [];
  DISCIPLINES.forEach(function(d) { if (allTags.indexOf(d.tag) === -1) { allTags.push(d.tag); } });

  var filterHtml = '<button class="ftag' + (activeTags.size === 0 ? ' active' : '') + '" onclick="activeTags.clear();render()">All</button>';
  allTags.forEach(function(t) {
    var active = activeTags.has(t) ? ' active' : '';
    filterHtml += '<button class="ftag' + active + '" onclick="toggleTag(\'' + t + '\')">' + t + '</button>';
  });
  document.getElementById('filters').innerHTML = filterHtml;

  var html = '';
  var any = false;

  DISCIPLINES.forEach(function(d) {
    if (activeTags.size > 0 && !activeTags.has(d.tag)) { return; }

    var filtered = d.cases.filter(function(c) {
      if (!q) { return true; }
      if (c.title.toLowerCase().indexOf(q) !== -1) { return true; }
      if (c.note.toLowerCase().indexOf(q) !== -1) { return true; }
      for (var i = 0; i < c.steps.length; i++) {
        if (c.steps[i].toLowerCase().indexOf(q) !== -1) { return true; }
      }
      return false;
    });

    if (!filtered.length) { return; }
    any = true;

    html += '<div class="discipline">';
    html += '<div class="disc-head">';
    html += '<span class="disc-name">' + d.name + '</span>';
    html += '<span class="disc-badge" style="background:' + d.color + '22;color:' + d.color + '">' + d.tag + '</span>';
    html += '<span class="disc-count">' + filtered.length + ' case' + (filtered.length !== 1 ? 's' : '') + '</span>';
    html += '</div><div class="cases">';

    filtered.forEach(function(c) {
      var cid  = d.id + '-' + c.id;
      var open = openCards.has(cid);
      html += '<div class="card">';
      html += '<div class="card-head" onclick="toggleCard(\'' + cid + '\')">';
      html += '<span class="case-id">' + c.id + '</span>';
      html += '<span class="case-title">' + c.title + '</span>';
      html += '<div class="pills">' + buildPills(c.types) + '</div>';
      html += '<span class="chev' + (open ? ' open' : '') + '">&#9654;</span>';
      html += '</div>';
      html += '<div class="card-body' + (open ? ' open' : '') + '">';
      html += '<div class="wf-label">Workflow</div>';
      html += '<div class="wf-steps">' + buildSteps(c.steps) + '</div>';
      html += '<div class="case-note">' + c.note + '</div>';
      html += '</div></div>';
    });

    html += '</div></div>';
  });

  document.getElementById('content').innerHTML = any ? html : '<div class="no-results">No matching use cases.</div>';
}

render();
</script>
</body>
</html>
