  /api/v1/proc/delete-domain:
    post:
      summary: Delete a domain — drops PGD tables, removes all registry entries
      description: >
        Permanently deletes a domain by name. Intended primarily for development
        and testing cleanup. Use with caution — all domain data is destroyed.

        Steps performed:
          1. Look up all PGC_Schema rows where domain = domainName and target = pgd
          2. For each table: call SERV deleteTable (DROP TABLE CASCADE + remove
             PGC_Schema + PGC_TableMap rows)
          3. Remove PGC_DomainHelp row for the domain
          4. Return summary of what was deleted

        If the domain has no tables in PGC_Schema and no PGC_DomainHelp row,
        returns success with deletedTables: [] and a warning — not an error,
        since the desired end state (domain absent) is already true.

        Transport-agnostic — callable via HTTP (curl) or SQS.
      tags: [PROC]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
                  description: Snake_case domain name as stored in PGC_Schema.domain
                  example: stock_portfolio
                callback:
                  $ref: '#/components/schemas/Callback'
                traceId:
                  type: string
                  format: uuid
            example:
              domain: stock_portfolio
      responses:
        '200':
          description: Domain deleted (or was already absent)
          content:
            application/json:
              examples:
                deleted:
                  summary: Domain fully deleted
                  value:
                    success: true
                    domain: stock_portfolio
                    deletedTables:
                      - PGD_Portfolios
                      - PGD_Holdings
                      - PGD_StockPrices
                    domainHelpRemoved: true
                already_absent:
                  summary: Domain had no tables or registry entries
                  value:
                    success: true
                    domain: stock_portfolio
                    deletedTables: []
                    domainHelpRemoved: false
                    warning: "No tables or registry entries found for domain \"stock_portfolio\""
        '400':
          description: domain is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: SERV deleteTable or PGC_DomainHelp removal failed

  /api/v1/proc/design-domain:
    post:
      summary: LLM domain design — no DB writes, returns scaffold for human review
      description: >
        Phase 1 of the two-phase domain creation flow.
        Calls the LLM to design a full relational schema from user input,
        validates the scaffold via /proc/review-output (Ajv + semantic rules),
        stores the validated scaffold in PGC_WorkflowRun.state, then posts
        a Block Kit review message to Slack and pauses — waiting for human approval.

        This endpoint does NOT create any tables or write to PGC_Schema.
        All DB writes happen in /proc/create-domain after human confirmation.

        Transport-agnostic — called identically via HTTP (curl/test) or SQS
        (DESIGN_DOMAIN message from WorkflowQueue).

        Flow:
          1. Read create_domain prompt from PGC_Prompt
          2. Call LLM → proposed_scaffold { domain, tables, domainHelp }
          3. Call /proc/review-output — Ajv + semantic validation (2-attempt loop)
          4. If validation fails both attempts → enqueue error to callback, halt
          5. Store validated scaffold in PGC_WorkflowRun.state
          6. Post Block Kit review message to Slack thread:
               "Here's my plan for domain *<domain>*: <table summary>. Does this look right?"
               Buttons: [✅ Review fields] [🔀 Merge tables] [➕ Add a table] [🔄 Start over] [❌ Cancel]
          7. Set PGC_WorkflowRun.status = 'awaiting_human_gate' — halt execution

        The user's button click arrives via /ui/slack/interactive → WorkflowQueue
        resume_gate → Step Processor routes based on button action.

        On HTTP delivery (curl): returns the scaffold directly without posting to Slack.
        Used for testing the LLM design step in isolation.
      tags: [PROC]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userInput]
              properties:
                userInput:
                  type: string
                  description: >
                    Free-form natural language description of the domain.
                    LLM infers a clean snake_case domain name from this.
                  example: stock portfolio with price history and alerts
                workflowRunId:
                  type: integer
                  description: >
                    PGC_WorkflowRun.id for this execution. Required on SQS delivery —
                    generated by SlackbotFunction when enqueuing DESIGN_DOMAIN.
                    Omit on HTTP (curl) calls — no WorkflowRun row needed for direct testing.
                callback:
                  $ref: '#/components/schemas/Callback'
                traceId:
                  type: string
                  format: uuid
            examples:
              sqs_delivery:
                summary: SQS delivery from Slack /create-domain command
                value:
                  userInput: stock portfolio with price history and alerts
                  workflowRunId: 12
                  callback:
                    provider: slack
                    channel: C0AEJ87JSKF
                    threadId: "1234567890.123456"
              http_test:
                summary: Direct curl test — no WorkflowRun, no Slack
                value:
                  userInput: stock portfolio with price history and alerts
      responses:
        '200':
          description: >
            Scaffold designed and validated. On SQS delivery: Block Kit message posted
            to Slack and run paused — response is empty (async). On HTTP delivery:
            scaffold returned directly for inspection.
          content:
            application/json:
              examples:
                http_response:
                  summary: HTTP curl response — scaffold returned directly
                  value:
                    success: true
                    domain: stock_portfolio
                    tables:
                      - tableName: PGD_Portfolios
                        description: Stores user portfolio definitions
                      - tableName: PGD_Holdings
                        description: Individual stock positions within a portfolio
                      - tableName: PGD_StockPrices
                        description: Historical and current price data per ticker
                    validatedAt: "2026-03-19T16:00:00.000Z"
                sqs_response:
                  summary: SQS delivery — empty body, Slack message posted async
                  value: {}
        '400':
          description: >
            HTTP path only — userInput is missing or empty.
            On SQS delivery, missing userInput enqueues an error message to the
            callback channel (Slack reply) and returns cleanly — the SQS message
            is not retried since this is a caller error, not an infrastructure failure.
        '422':
          description: >
            LLM scaffold failed Ajv or semantic validation after 2 attempts.
            Error details written to PGC_Prompt.error_log. WorkflowRun set to failed.
        '500':
          description: LLM call, review-output, or WorkflowRun write failed

  /api/v1/proc/create-domain:
    post:
      summary: Execute confirmed domain creation — DDL + registry writes
      description: >
        Phase 2 of the two-phase domain creation flow. Called after the user
        confirms the scaffold designed by /proc/design-domain.

        Reads the validated scaffold from PGC_WorkflowRun.state (SQS path) or
        directly from the request body (HTTP path), creates each PGD table via
        SERV-Schema createTable, registers the domain in PGC_DomainHelp, and
        registers entity definitions in PGC_EntitySchema.

        Transport-agnostic — called identically via HTTP (curl/test) or SQS
        (CREATE_DOMAIN message from WorkflowQueue after human gate confirmation).

        NOTE: The current deployed implementation is the monolithic pre-gate
        version — it calls the LLM and executes DDL in a single step with no
        human review. The two-phase flow (design-domain → human gate → create-domain)
        is the target state once the Step Processor is built (Phase 2 item 5).
        The monolithic version will be replaced by the declarative create_domain
        workflow in PGC_Workflow at that point.

        On SQS delivery, result is enqueued to SYSSQSCallbackResults for
        SlackCallbackListenerFunction to post as a threaded reply.
      tags: [PROC]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userInput]
              properties:
                userInput:
                  type: string
                  description: >
                    Free-form natural language description of the domain.
                    LLM infers a clean snake_case domain name from this.
                  example: recipes with ingredients and nutritional info
                callback:
                  $ref: '#/components/schemas/Callback'
                traceId:
                  type: string
                  format: uuid
            example:
              userInput: recipes with ingredients and nutritional info
              callback:
                provider: slack
                channel: C0AEJ87JSKF
                threadId: "1234567890.123456"
      responses:
        '200':
          description: Domain created successfully
          content:
            application/json:
              example:
                success: true
                domainName: recipes
                tables:
                  - { tableName: PGD_Recipes,     status: created }
                  - { tableName: PGD_Ingredients,  status: created }
                completedAt: "2026-03-18T10:46:45.870Z"
        '400':
          description: userInput is required
        '500':
          description: LLM call, validation, or DDL execution failed

  /api/v1/proc/create-workflow:
    post:
      summary: Step Processor entry point for the create_workflow workflow
      description: >
        Creates a PGC_WorkflowRun row for the `create_workflow` workflow and enqueues
        WORKFLOW_STEP / execute_top to start the Step Processor. All LLM calls,
        preference gates, simulation, and registration steps are driven declaratively
        by run-workflow.mjs from the PGC_Workflow.steps definition.

        Two SQS entry paths converge here:

        **Via classify-intent heavy-lift dispatch**
          classify-intent.mjs resolves CREATE_WORKFLOW (Pass 1 heavy_lift or Tier 3)
          and enqueues a CREATE_WORKFLOW SQS message. The domain field is populated
          by matchDomainAlias() when the user's input contains a recognisable domain
          alias (e.g. "Spanish vocabulary quiz" → domain: "spanish_flashcards").

        **Via direct /create-workflow Slack command**
          ui/slackbot/create-workflow.mjs enqueues CREATE_WORKFLOW with domain: null.
          No alias lookup runs on this path. The analyze_and_design_workflow LLM
          prompt (step 7) extracts domain context from userInput directly.

        In both cases, domain flows into PGC_WorkflowRun.input so that create_workflow
        step 1 (serv_query PGC_Schema) can filter by domain, and step 7
        (analyze_and_design_workflow) receives it as {{input.domain}}.

        **HTTP path — developer testing**
          Caller supplies userInput and optionally domain. Returns workflowRunId
          immediately. Workflow executes asynchronously — monitor via PGC_WorkflowRun.

        Transport-agnostic — business logic is identical for both transports.
      tags: [PROC]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userInput]
              properties:
                userInput:
                  type: string
                  description: >
                    Free-form natural language description of the workflow to create.
                  example: Spanish vocabulary quiz
                domain:
                  type: string
                  nullable: true
                  description: >
                    Snake_case domain name resolved by classify-intent.mjs alias lookup.
                    Null when triggered via the direct /create-workflow Slack command.
                    Flows into PGC_WorkflowRun.input.domain — available as {{input.domain}}
                    to workflow steps.
                  example: spanish_flashcards
                callback:
                  $ref: '#/components/schemas/Callback'
                traceId:
                  type: string
                  format: uuid
            examples:
              sqs_with_domain:
                summary: SQS delivery — domain resolved by alias lookup
                value:
                  userInput: Spanish vocabulary quiz
                  domain: spanish_flashcards
                  callback:
                    provider: slack
                    channel: C0AEJ87JSKF
                    threadId: "1234567890.123456"
              sqs_no_domain:
                summary: SQS delivery — direct /create-workflow command, domain null
                value:
                  userInput: weekly expense report
                  domain: null
                  callback:
                    provider: slack
                    channel: C0AEJ87JSKF
                    threadId: "1234567890.123456"
              http_test:
                summary: HTTP test — returns workflowRunId immediately
                value:
                  userInput: Spanish vocabulary quiz
                  domain: spanish_flashcards
      responses:
        '200':
          description: >
            WorkflowRun created and execute_top enqueued. On HTTP delivery: workflowRunId
            returned immediately — workflow executes asynchronously. On SQS delivery:
            empty response body — progress posted to Slack thread via callback.
          content:
            application/json:
              examples:
                http_response:
                  summary: HTTP — run started
                  value:
                    success: true
                    workflowRunId: 42
                    status: running
        '400':
          description: userInput is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: >
            create_workflow not found in PGC_Workflow (run: node dev_scripts/upsert-workflow.mjs create_workflow),
            or PGC_WorkflowRun insert failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/proc/shutdown:
    post:
      summary: Emergency stop — cancel active workflow runs
      description: >
        Immediately cancels all active workflow runs for this instance, or a
        specific run by ID.

        Steps performed:
          1. Calls SERV getRows on PGC_WorkflowRun — filters by status=active
             and optionally by id=workflowRunId
          2. Calls SERV updateRows on PGC_WorkflowRun — sets status=cancelled
             for each matching run (non-empty filters enforced by updateRows gate)
          3. Enqueues { type: WORKFLOW_STEP, action: cancel, workflowRunId } to
             WorkflowQueue for each cancelled run — so any in-flight SQS step
             is discarded when the Step Processor checks status before executing
          4. Returns ShutdownResult — cancelledCount: 0 when no active runs exist

        Called synchronously by SlackbotFunction on /shutdown command —
        no SQS hop. Must respond within Slack's 3s window.

        NOTE: Step Processor (Phase 2 item 5) MUST check PGC_WorkflowRun.status
        as its first action before executing any step. That check is what gives
        the cancel signal its effect. This is a hard constraint on the Step Processor design.
      tags: [PROC]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workflowRunId:
                  type: integer
                  description: >
                    Specific run to cancel. Omit to cancel ALL active runs.
                callback:
                  $ref: '#/components/schemas/Callback'
                traceId:
                  type: string
                  format: uuid
            examples:
              cancel_all:
                summary: Cancel all active runs
                value:
                  callback:
                    provider: slack
                    channel: C0AEJ87JSKF
                    threadId: "1234567890.123456"
              cancel_specific:
                summary: Cancel a specific run
                value:
                  workflowRunId: 42
                  callback:
                    provider: slack
                    channel: C0AEJ87JSKF
                    threadId: "1234567890.123456"
      responses:
        '200':
          description: Shutdown complete — cancelledCount is 0 when no active runs exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShutdownResult'
              examples:
                runs_cancelled:
                  summary: One or more runs cancelled
                  value:
                    success: true
                    cancelledCount: 2
                    cancelled:
                      - { workflowRunId: 42, workflowName: create_domain, stoppedAtStep: 3 }
                      - { workflowRunId: 43, workflowName: create_domain, stoppedAtStep: 1 }
                no_active_runs:
                  summary: No active workflows to cancel
                  value:
                    success: true
                    cancelledCount: 0
                    cancelled: []
        '500':
          description: SERV getRows, updateRows, or SQS enqueue failed

  /api/v1/proc/simulate-workflow:
    post:
      summary: Workflow simulation — static analysis and path execution validation
      description: >
        Validates a workflow step array before it is registered in PGC_Workflow.
        Runs three validation levels in order, stopping early if a prior level fails.

        **Level 1 — Static analysis (no mocks required)**

        Structural checks on the step array itself:
          - All on_success, on_failure, on_select values are valid routing tokens
          - All step:N routing targets exist in the step array
          - All {{template}} references resolve to an output_key written by a prior step
            on that execution path
          - All items_key values in iterator steps resolve to arrays written prior
          - All input.prompt values in llm_call steps name a known intent_category
          - No output_key on review_object or confirm gate types (those do not write output)
          - Every human_gate has at least one option with action=cancel

        Level 1 failures are returned immediately — no path execution occurs.

        **Level 2 — Path execution (requires mockOutputs and simulationPaths)**

        Executes each named path in simulationPaths independently. At each step,
        injects the mock output or gate decision instead of calling the real service.
        Records the local_state transition log. Fails the path if any template
        variable is unresolvable or if the actual terminal step does not match
        expected_terminal.


        This endpoint is called:
          - Directly by developers testing a workflow definition before registration
          - By the simulate step type in step-executor.mjs during create_workflow execution
            (in that context, the request body is assembled from local_state keys)

        The endpoint does not create or modify any PGC_WorkflowRun row. It is
        stateless — no side effects on success or failure.
      tags: [PROC]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateWorkflowRequest'
            examples:
              static_analysis_only:
                summary: Level 1 only — validate step array structure without mocks
                value:
                  steps:
                    - { step: "1", type: "llm_call", input: { prompt: "create_domain", userInput: "{{input.userInput}}" }, output_key: "proposed_scaffold", on_success: "next", on_failure: "cancel" }
                    - { step: "2", type: "serv_insert", input: { tableName: "PGC_DomainHelp", row: "{{confirmed_domain_help}}" }, on_success: "next", on_failure: "cancel" }
                  simulationPaths:
                    - path_name: happy_path
                      decisions:
                        - { step: "1", outcome: success }
                      expected_terminal: end
                  traceId: "ae9a8899-94a5-4a16-8dc1-803764d373d7"
              full_simulation:
                summary: Full simulation — all three levels
                value:
                  steps:
                    - { step: "1", type: "llm_call", input: { prompt: "create_domain", userInput: "{{input.userInput}}" }, output_key: "proposed_scaffold", on_success: "next", on_failure: "cancel" }
                    - { step: "2", type: "human_gate", gate_type: "confirm", message_template: "Create domain {{proposed_scaffold.domain}}?", options: [{ label: "Confirm", action: "confirm", on_select: "next" }, { label: "Cancel", action: "cancel", on_select: "cancel" }], on_success: "next", on_failure: "cancel" }
                    - { step: "3", type: "end" }
                  mockOutputs:
                    "1": { domain: "recipes", tables: [] }
                  simulationPaths:
                    - path_name: happy_path
                      decisions:
                        - { step: "1", outcome: success }
                        - { step: "2", outcome: gate, user_response: confirm, on_select: "next" }
                      expected_terminal: end
                    - path_name: user_cancels
                      decisions:
                        - { step: "1", outcome: success }
                        - { step: "2", outcome: gate, user_response: cancel, on_select: cancel }
                      expected_terminal: cancelled
                  runInput:
                    userInput: "recipe collection with ingredients"
                  traceId: "ae9a8899-94a5-4a16-8dc1-803764d373d7"
      responses:
        '200':
          description: >
            Simulation complete. Check passed field — false means one or more
            validation levels failed. A 200 response does not mean the workflow is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulateWorkflowResponse'
              examples:
                all_passed:
                  summary: All paths passed all validation levels
                  value:
                    passed: true
                    pathsRun: 3
                    pathsPassed: 3
                    pathsFailed: 0
                    staticAnalysis: { passed: true, issues: [] }
                    pathResults:
                      - path_name: happy_path
                        passed: true
                        steps_executed: 11
                        terminal: end
                        expected_terminal: end
                    skipPathWarnings: []
                    traceId: "ae9a8899-94a5-4a16-8dc1-803764d373d7"
                static_analysis_failed:
                  summary: Level 1 failed — unresolved template variable detected
                  value:
                    passed: false
                    pathsRun: 0
                    pathsPassed: 0
                    pathsFailed: 0
                    staticAnalysis:
                      passed: false
                      issues:
                        - check: unresolved_template_variable
                          step: "8"
                          failure_class: unresolved_template_variable
                          detail: "Template variable 'confirmed_domain_help' not found in local_state at step 8. Available keys: input, proposed_scaffold, generated"
                          suggestion: "Did you mean '{{generated.domainHelp}}'?"
                    pathResults: []
                    skipPathWarnings: []
                    traceId: "ae9a8899-94a5-4a16-8dc1-803764d373d7"
                path_execution_failed:
                  summary: Level 2 failed — path reached unexpected terminal
                  value:
                    passed: false
                    pathsRun: 2
                    pathsPassed: 1
                    pathsFailed: 1
                    staticAnalysis: { passed: true, issues: [] }
                    pathResults:
                      - path_name: happy_path
                        passed: true
                        steps_executed: 11
                        terminal: end
                        expected_terminal: end
                      - path_name: llm_step_fails
                        passed: true
                        steps_executed: 1
                        terminal: cancelled
                        expected_terminal: cancelled
                    skipPathWarnings: []
                    traceId: "ae9a8899-94a5-4a16-8dc1-803764d373d7"

        '400':
          description: >
            Missing required fields, empty steps array, or empty simulationPaths.
            Also returned when Level 2 or 3 is requested but mockOutputs is absent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Simulation infrastructure error — step executor threw unexpectedly

  /api/v1/proc/review-output:
    post:
      summary: Right-brain output validation — Ajv JSON Schema + in-situ JS sandbox
      description: >
        Validates LLM-generated output before it is passed to any downstream step
        (DDL, SQS payload, workflow state write). Implements the repeat-until-correct
        loop defined in architecture Section 6.10.

        For JSON output (outputType: json):
          - Fetches PGC_Prompt.output_schema for the given intentCategory
          - Validates the output against the schema using Ajv
          - If invalid: injects Ajv errors into a correction prompt, calls LLM once more
          - If attempt 2 also fails: writes to PGC_Prompt.error_log, returns valid: false

        For JS output (outputType: js):
          - Parses the generated code with acorn (AST gate — syntax validation)
          - Executes in vm.runInNewContext() sandbox with hard 500ms timeout
          - Validates output shape against PGC_StepType.output_schema
          - Same 2-attempt correction loop applies

        Maximum 2 LLM correction attempts. Never an unbounded loop.
        All failures written to PGC_Prompt.error_log regardless of recovery outcome.
      tags: [PROC]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewOutputRequest'
            examples:
              json_validation:
                summary: Validate LLM scaffold JSON
                value:
                  intentCategory: create_domain
                  outputType: json
                  output:
                    domain: recipes
                    tables:
                      - tableName: PGD_Recipes
                        target: pgd
                        columns:
                          - { name: id, type: serial, primaryKey: true }
                  traceId: "ae9a8899-94a5-4a16-8dc1-803764d373d7"
              js_validation:
                summary: Validate LLM-generated JS transform
                value:
                  intentCategory: js_transform_merge_tables
                  outputType: js
                  output: "function transform(input) { return { merged: input.tables }; }"
                  testInput: { tables: ["PGD_A", "PGD_B"] }
                  traceId: "ae9a8899-94a5-4a16-8dc1-803764d373d7"
      responses:
        '200':
          description: Validation result — check valid field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewOutputResponse'
              examples:
                valid_first_attempt:
                  summary: Valid on first attempt
                  value:
                    valid: true
                    intentCategory: create_domain
                    attempt: 1
                    traceId: "ae9a8899-94a5-4a16-8dc1-803764d373d7"
                valid_after_correction:
                  summary: Invalid attempt 1, corrected on attempt 2
                  value:
                    valid: true
                    intentCategory: create_domain
                    attempt: 2
                    correctedOutput:
                      domain: recipes
                      tables: []
                    traceId: "ae9a8899-94a5-4a16-8dc1-803764d373d7"
                invalid_both_attempts:
                  summary: Both attempts failed — run halted
                  value:
                    valid: false
                    intentCategory: create_domain
                    attempt: 2
                    errors:
                      - instancePath: "/tables/2/constraints/0"
                        keyword: required
                        message: "must have required property 'expression'"
                    errorLogged: true
                    traceId: "ae9a8899-94a5-4a16-8dc1-803764d373d7"
        '400':
          description: Missing intentCategory or output, unknown outputType
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No PGC_Prompt row found for intentCategory
        '500':
          description: Validation infrastructure error (Ajv compile, vm sandbox, DB write)
  # ── SERV ───────────────────────────────────────────────────────────────────

  /api/v1/serv/ping-db:
    get:
      summary: PostgreSQL health check
      description: Validates ServFunction → PGC + PGD connectivity. Returns version strings.
      tags: [Ping]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Both databases reachable
          content:
            application/json:
              example:
                success: true
                pgc:
                  reachable: true
                  version: "PostgreSQL 16.6 on aarch64..."
                pgd:
                  reachable: true
                  version: "PostgreSQL 16.6 on aarch64..."
        '500':
          description: One or both databases unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/serv/schema/createTable:
    post:
      summary: Create a table + register in PGC_Schema
      description: >
        Executes DDL on target database (pgc or pgd), writes metadata row
        to PGC_Schema, registers in PGC_TableMap. Optionally notifies Slack.
        Column types are validated against a security whitelist before execution.
      tags: [SERV-Schema]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tableName, target, columns]
              properties:
                tableName:
                  type: string
                  pattern: '^(PGC|PGD)_[A-Za-z][A-Za-z0-9_]*$'
                  example: PGD_Recipes
                target:
                  type: string
                  enum: [pgc, pgd]
                description:
                  type: string
                columns:
                  type: array
                  items:
                    $ref: '#/components/schemas/ColumnDefinition'
                foreignKeys:
                  type: array
                  items:
                    $ref: '#/components/schemas/ForeignKeyDefinition'
                constraints:
                  type: array
                  items:
                    $ref: '#/components/schemas/ConstraintDefinition'
                triggers:
                  type: array
                  items:
                    $ref: '#/components/schemas/TriggerDefinition'
            example:
              tableName: PGD_Recipes
              target: pgd
              description: Recipe domain table
              columns:
                - { name: id,         type: serial,      primaryKey: true }
                - { name: name,       type: text,        nullable: false }
                - { name: created_at, type: timestamptz, nullable: false, default: "now()" }
      responses:
        '200':
          description: Table created and registered
          content:
            application/json:
              example:
                success: true
                tableName: PGD_Recipes
                target: pgd
                schemaId: 5
                createdAt: "2026-03-11T15:18:24.000Z"
        '400':
          description: Validation error — invalid table name, missing fields, disallowed type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Table already exists in PGC_Schema
        '500':
          description: DDL execution or PGC write failed

  /api/v1/serv/schema/listTables:
    post:
      summary: List all tables in PGC_Schema
      description: Returns all registered tables, optionally filtered by target (pgc or pgd).
      tags: [SERV-Schema]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                target:
                  type: string
                  enum: [pgc, pgd]
                  description: Optional filter
            example:
              target: pgd
      responses:
        '200':
          description: Table list
          content:
            application/json:
              example:
                success: true
                count: 4
                tables:
                  - { id: 1, table_name: PGC_Schema, target: pgc }
                  - { id: 2, table_name: PGC_TableMap, target: pgc }

  /api/v1/serv/schema/getTable:
    post:
      summary: Get one table definition from PGC_Schema
      tags: [SERV-Schema]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tableName]
              properties:
                tableName:
                  type: string
            example:
              tableName: PGC_Schema
      responses:
        '200':
          description: Full schema row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaRow'
        '404':
          description: Table not found in PGC_Schema

  /api/v1/serv/schema/updateTable:
    post:
      summary: Update metadata in PGC_Schema
      description: >
        Updates description, columns, foreign_keys, constraints, or triggers
        in PGC_Schema. Does not execute ALTER TABLE — metadata only.
      tags: [SERV-Schema]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tableName]
              properties:
                tableName:
                  type: string
                description:
                  type: string
                columns:
                  type: array
                  items:
                    $ref: '#/components/schemas/ColumnDefinition'
                foreignKeys:
                  type: array
                  items:
                    $ref: '#/components/schemas/ForeignKeyDefinition'
            example:
              tableName: PGD_Recipes
              description: Updated recipe domain table description
      responses:
        '200':
          description: Metadata updated
        '400':
          description: No updatable fields provided
        '404':
          description: Table not found

  /api/v1/serv/schema/addColumn:
    post:
      summary: Add a column to an existing table — DDL + PGC_Schema sync
      description: >
        Executes ALTER TABLE ... ADD COLUMN IF NOT EXISTS on the physical table
        and appends the column definition to PGC_Schema.columns atomically.

        Idempotent — if the column already exists in PGC_Schema.columns the
        operation is a no-op and returns action=already_exists.

        schemaOnly mode: when the physical column already exists in PostgreSQL
        (e.g. added manually or by a prior partial run) but PGC_Schema.columns
        is out of sync, set schemaOnly=true to register the column in metadata
        without executing DDL. Use this to repair sync gaps.

        Column name must be lowercase alphanumeric + underscore.
        Column type must be in the SERV-Schema ALLOWED_TYPES list.
        Targets the correct database (pgc or pgd) based on PGC_Schema.target.
      tags: [SERV-Schema]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tableName, column]
              properties:
                tableName:
                  type: string
                  example: PGC_Prompt
                column:
                  $ref: '#/components/schemas/ColumnDefinition'
                schemaOnly:
                  type: boolean
                  default: false
                  description: >
                    Skip DDL — only register the column in PGC_Schema.columns.
                    Use when the physical column already exists but metadata is out of sync.
            examples:
              add_column:
                summary: Add new column (DDL + metadata)
                value:
                  tableName: PGC_Prompt
                  column:
                    name: probe_input
                    type: jsonb
                    nullable: true
              schema_only:
                summary: Register existing physical column in metadata only
                value:
                  tableName: PGC_Prompt
                  column:
                    name: max_output_tokens
                    type: integer
                    nullable: true
                  schemaOnly: true
              vector_with_embed_source:
                summary: >
                  Add vector column with embed_source — SERV will auto-embed on
                  insert/update using the named source fields
                value:
                  tableName: PGC_DomainHelp
                  column:
                    name: embedding
                    type: vector
                    nullable: true
                    embed_source: ["domain", "description", "aliases"]
      responses:
        '200':
          description: Column added or registered
          content:
            application/json:
              examples:
                added:
                  summary: DDL executed + metadata updated
                  value:
                    success: true
                    tableName: PGC_Prompt
                    column: probe_input
                    action: added
                schema_registered:
                  summary: Metadata registered (schemaOnly — no DDL)
                  value:
                    success: true
                    tableName: PGC_Prompt
                    column: max_output_tokens
                    action: schema_registered
                already_exists:
                  summary: Column already in PGC_Schema — no-op
                  value:
                    success: true
                    tableName: PGC_Prompt
                    column: probe_input
                    action: already_exists
        '400':
          description: Invalid tableName, column name, or unsupported column type
        '404':
          description: Table not found in PGC_Schema
        '500':
          description: ALTER TABLE or PGC_Schema update failed

  /api/v1/serv/schema/deleteTable:
    post:
      summary: Drop table + remove from PGC_Schema
      description: >
        Drops the physical table (CASCADE) and removes rows from
        PGC_Schema and PGC_TableMap. Protected system tables
        (PGC_Schema, PGC_TableMap, PGC_EntitySchema, PGC_DomainHelp)
        are rejected with 403.
      tags: [SERV-Schema]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tableName]
              properties:
                tableName:
                  type: string
            example:
              tableName: PGD_Recipes
      responses:
        '200':
          description: Table dropped and registry entries removed
        '403':
          description: Protected system table — cannot be dropped
        '404':
          description: Table not found in PGC_Schema
        '500':
          description: Drop or registry cleanup failed

  # ── SERV-Table ─────────────────────────────────────────────────────────────

  /api/v1/serv/table/getRows:
    post:
      summary: SELECT rows from a registered table
      description: >
        Parameterised SELECT gated by PGC_TableMap. Supports filters, orderBy,
        and limit. Column names in filters are validated against PGC_Schema.
        Filter operators — eq, neq, gt, gte, lt, lte, like, in, is_null, not_null.

        **pgvector semantic search (vectorSearch)**

        When vectorSearch is supplied, SERV embeds queryText using OpenAI
        text-embedding-3-small and ranks results by cosine similarity against the
        named vector column. Results include a `similarity` float (0–1).
        vectorSearch can be combined with filters — filters pre-qualify rows,
        vectorSearch then ranks survivors. vectorSearch takes precedence over
        orderBy when both are specified.

        The caller supplies plain text only — SERV owns all embedding operations.
      tags: [SERV-Table]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tableName]
              properties:
                tableName:
                  type: string
                  pattern: '^(PGC|PGD)_[A-Za-z][A-Za-z0-9_]*$'
                  example: PGC_Prompt
                filters:
                  type: array
                  items:
                    $ref: '#/components/schemas/FilterItem'
                orderBy:
                  type: object
                  description: Ignored when vectorSearch is present — similarity ordering always applies.
                  properties:
                    column:
                      type: string
                    direction:
                      type: string
                      enum: [asc, desc]
                      default: asc
                limit:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  default: 100
                vectorSearch:
                  $ref: '#/components/schemas/VectorSearch'
            examples:
              standard:
                summary: Standard filtered SELECT
                value:
                  tableName: PGC_Prompt
                  filters:
                    - { column: intent_category, op: eq, value: create_domain }
                    - { column: was_successful,  op: not_null }
                  orderBy: { column: version, direction: desc }
                  limit: 10
              semantic_search:
                summary: pgvector semantic domain resolution — top-1 match
                value:
                  tableName: PGC_DomainHelp
                  vectorSearch:
                    column: embedding
                    queryText: spanish flashcard quiz
                    threshold: 0.75
                    limit: 1
              combined:
                summary: Filters + vectorSearch — qualify then rank
                value:
                  tableName: PGD_Recipes
                  filters:
                    - { column: cuisine_type, op: eq, value: Italian }
                  vectorSearch:
                    column: description_embedding
                    queryText: creamy pasta with eggs and guanciale
                    threshold: 0.70
                    limit: 5
      responses:
        '200':
          description: >
            Matching rows returned. When vectorSearch was used, each row includes
            a `similarity` float field (0–1) — absent on standard SELECT.
          content:
            application/json:
              examples:
                standard:
                  summary: Standard rows — no similarity field
                  value:
                    success: true
                    tableName: PGC_Prompt
                    count: 1
                    rows:
                      - id: 1
                        intent_category: create_domain
                        prompt_text: "You are a schema designer..."
                        version: 1
                semantic:
                  summary: Vector search — similarity field present
                  value:
                    success: true
                    tableName: PGC_DomainHelp
                    count: 1
                    rows:
                      - id: 3
                        domain: spanish_flashcards
                        aliases: ["flashcard", "flashcards", "spanish"]
                        description: Spanish vocabulary flashcard domain
                        similarity: 0.871
        '400':
          description: >
            Validation error — bad table name, unknown column, disallowed operator,
            vectorSearch column not found or not of type vector
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Table not registered in PGC_TableMap
        '500':
          description: Query or embedding call failed

  /api/v1/serv/table/insertRow:
    post:
      summary: INSERT a single row into a registered table
      description: >
        Single INSERT gated by PGC_TableMap allow_insert flag.
        Column names validated against PGC_Schema. Returns full inserted row.

        **Automatic embedding**

        When the table has vector columns with `embed_source` defined in PGC_Schema,
        SERV automatically computes the embedding from the named source fields and
        injects it before executing the INSERT. Callers must not supply the vector
        column — it is always computed server-side from the source field values in
        the row payload.
      tags: [SERV-Table]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tableName, row]
              properties:
                tableName:
                  type: string
                  pattern: '^(PGC|PGD)_[A-Za-z][A-Za-z0-9_]*$'
                  example: PGC_DomainHelp
                row:
                  type: object
                  description: >
                    Column/value pairs to insert. Vector columns with embed_source
                    in PGC_Schema are computed and injected by SERV — do not include
                    them in this payload.
            examples:
              standard:
                summary: Non-vector table insert
                value:
                  tableName: PGC_IntentMap
                  row:
                    pattern: create.domain|new.domain
                    intent_category: create_domain
                    action_type: workflow
              with_embedding:
                summary: >
                  Table with embed_source — omit embedding, SERV computes it automatically
                value:
                  tableName: PGC_DomainHelp
                  row:
                    domain: recipes
                    aliases: ["recipe", "cooking"]
                    description: Recipe management domain
                    commands: []
      responses:
        '200':
          description: Row inserted — embedding column populated automatically when applicable
          content:
            application/json:
              example:
                success: true
                tableName: PGC_DomainHelp
                row:
                  id: 1
                  domain: recipes
                  aliases: ["recipe", "cooking"]
                  description: Recipe management domain
                  embedding: "<1536-dim vector — omitted from display>"
        '400':
          description: Validation error — bad table name or unknown column
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: INSERT not permitted on this table
        '404':
          description: Table not registered in PGC_TableMap
        '500':
          description: Insert or embedding computation failed

  /api/v1/serv/table/updateRows:
    post:
      summary: UPDATE rows in a registered table
      description: >
        Parameterised UPDATE gated by PGC_TableMap allow_update flag.
        Column names in both updates and filters are validated against PGC_Schema.
        filters is required and must be non-empty — unfiltered mass UPDATE is not permitted.
        Returns all updated rows via RETURNING *.

        **Automatic embedding re-computation**

        When the table has vector columns with `embed_source` defined in PGC_Schema,
        and at least one `embed_source` field is present in `updates`, SERV performs
        a read-before-write: it SELECTs the current row, merges it with `updates`,
        recomputes the embedding from all source fields (not just the changed ones),
        and includes the refreshed vector in the UPDATE. This ensures the embedding
        always reflects the complete row state, even on partial updates.

        Callers do not need to supply the vector column in `updates`. If an
        embed_source field is not changing, it still does not need to be included —
        SERV reads the current value from the DB.

        Known limitation: when filters match multiple rows, the first matched row's
        values are used for any embed_source fields absent from `updates`. This is
        the same data being written to all matched rows in any case — uniform bulk
        updates remain consistent.
      tags: [SERV-Table]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tableName, filters, updates]
              properties:
                tableName:
                  type: string
                  pattern: '^(PGC|PGD)_[A-Za-z][A-Za-z0-9_]*$'
                  example: PGC_WorkflowRun
                filters:
                  type: array
                  minItems: 1
                  description: Required — must target specific rows. Unfiltered UPDATE is rejected.
                  items:
                    $ref: '#/components/schemas/FilterItem'
                updates:
                  type: object
                  description: >
                    Column/value pairs to set. jsonb values are serialized automatically.
                    Vector columns with embed_source are recomputed by SERV when any
                    embed_source field appears here — do not supply the vector value directly.
                  example:
                    status: cancelled
            examples:
              standard:
                summary: Standard update — no vector columns involved
                value:
                  tableName: PGC_WorkflowRun
                  filters:
                    - { column: id,     op: eq, value: 42 }
                    - { column: status, op: eq, value: active }
                  updates:
                    status: cancelled
              alias_update:
                summary: >
                  Update aliases on PGC_DomainHelp — SERV re-embeds automatically
                value:
                  tableName: PGC_DomainHelp
                  filters:
                    - { column: domain, op: eq, value: recipes }
                  updates:
                    aliases: ["recipe", "cooking", "meal", "dish"]
      responses:
        '200':
          description: >
            Rows updated — updatedCount is 0 when filters match nothing.
            When embedding was recomputed, the updated row includes the refreshed vector.
          content:
            application/json:
              examples:
                rows_updated:
                  summary: One or more rows updated
                  value:
                    success: true
                    tableName: PGC_WorkflowRun
                    updatedCount: 1
                    rows:
                      - id: 42
                        status: cancelled
                        workflow_id: 3
                        created_at: "2026-03-19T10:00:00.000Z"
                no_match:
                  summary: Filters matched no rows
                  value:
                    success: true
                    tableName: PGC_WorkflowRun
                    updatedCount: 0
                    rows: []
        '400':
          description: >
            Validation error — missing filters, empty filters, bad table name,
            unknown column in updates or filters, disallowed operator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: UPDATE not permitted on this table (allow_update is false in PGC_TableMap)
        '404':
          description: Table not registered in PGC_TableMap
        '500':
          description: Update failed

  /api/v1/serv/table/deleteRows:
    post:
      summary: DELETE rows from a registered table
      description: >
        Parameterised DELETE gated by PGC_TableMap allow_delete flag.
        Column names in filters are validated against PGC_Schema.
        filters is required and must be non-empty — unfiltered mass DELETE is not permitted.
        Note: allow_delete is false on all PGC system tables in the seed data —
        domain data tables (PGD_*) are the expected use case.
      tags: [SERV-Table]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tableName, filters]
              properties:
                tableName:
                  type: string
                  pattern: '^(PGC|PGD)_[A-Za-z][A-Za-z0-9_]*$'
                  example: PGD_Recipes
                filters:
                  type: array
                  minItems: 1
                  description: Required — must target specific rows. Unfiltered DELETE is rejected.
                  items:
                    $ref: '#/components/schemas/FilterItem'
            example:
              tableName: PGD_Recipes
              filters:
                - { column: id, op: eq, value: 7 }
      responses:
        '200':
          description: Rows deleted — deletedCount is 0 when filters match nothing
          content:
            application/json:
              examples:
                rows_deleted:
                  summary: One or more rows deleted
                  value:
                    success: true
                    tableName: PGD_Recipes
                    deletedCount: 1
                no_match:
                  summary: Filters matched no rows
                  value:
                    success: true
                    tableName: PGD_Recipes
                    deletedCount: 0
        '400':
          description: >
            Validation error — missing filters, empty filters, bad table name,
            unknown column in filters, disallowed operator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: DELETE not permitted on this table (allow_delete is false in PGC_TableMap)
        '404':
          description: Table not registered in PGC_TableMap
        '500':
          description: Delete failed

  # ── SERV-Entity ────────────────────────────────────────────────────────────
  # User-facing domain data layer. Callers use entity names (Recipe, Stock),
  # never table names. PGC_EntitySchema defines the root_table, joins,
  # aggregations, and upsert_key for each entity.
  # PROC uses this layer for all workflow steps that touch user domain data.
  # SERV/table remains the layer for PGC system config operations.

  /api/v1/serv/entity/getEntity:
    post:
      summary: Fetch a single entity by id
      description: >
        Fetches one entity row from its root table, with all configured joins
        and jsonb_agg aggregations applied. Returns a rich object — e.g. a Recipe
        with its tags array already assembled.

        Lookup chain: entity_name → PGC_EntitySchema → root_table + joins + aggregations
        → single parameterised query on PGD database.
      tags: [SERV-Entity]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entityName, id]
              properties:
                entityName:
                  type: string
                  example: Recipe
                id:
                  type: integer
                  example: 5
            example:
              entityName: Recipe
              id: 5
      responses:
        '200':
          description: Entity found
          content:
            application/json:
              example:
                success: true
                entityName: Recipe
                entity:
                  id: 5
                  title: Spaghetti Carbonara
                  description: Classic Roman pasta dish
                  difficulty: medium
                  cuisine_type: Italian
                  tags: [pasta, italian, classic]
                  created_at: "2026-03-19T12:00:00.000Z"
        '404':
          description: Entity name not registered in PGC_EntitySchema, or id not found
        '500':
          description: Query failed

  /api/v1/serv/entity/listEntities:
    post:
      summary: List entities with optional filters, orderBy, limit
      description: >
        Returns multiple entity rows with joins and aggregations applied.
        Filters operate on the root table columns only — validated against
        PGC_Schema for the root_table. Default entity-level filters defined
        in PGC_EntitySchema.filters are always applied in addition to caller filters.
      tags: [SERV-Entity]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entityName]
              properties:
                entityName:
                  type: string
                  example: Recipe
                filters:
                  type: array
                  items:
                    $ref: '#/components/schemas/FilterItem'
                orderBy:
                  type: object
                  properties:
                    column:
                      type: string
                    direction:
                      type: string
                      enum: [asc, desc]
                      default: asc
                limit:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  default: 100
            example:
              entityName: Recipe
              filters:
                - { column: cuisine_type, op: eq, value: Italian }
              orderBy: { column: title, direction: asc }
              limit: 20
      responses:
        '200':
          description: Entity list returned
          content:
            application/json:
              example:
                success: true
                entityName: Recipe
                count: 2
                entities:
                  - id: 5
                    title: Spaghetti Carbonara
                    cuisine_type: Italian
                    tags: [pasta, italian]
                  - id: 7
                    title: Cacio e Pepe
                    cuisine_type: Italian
                    tags: [pasta, roman]
        '404':
          description: Entity name not registered in PGC_EntitySchema
        '500':
          description: Query failed

  /api/v1/serv/entity/createEntity:
    post:
      summary: INSERT a new entity row into the root table
      description: >
        Inserts a single row into the entity's root table. Column names are
        validated against PGC_Schema for the root_table. System columns
        (id, created_at, updated_at) are excluded from the insert — the DB
        sets these automatically.

        Child rows (e.g. RecipeIngredient) are created via their own createEntity
        call with the parent id provided in the row data.
      tags: [SERV-Entity]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entityName, row]
              properties:
                entityName:
                  type: string
                  example: Recipe
                row:
                  type: object
                  description: Column/value pairs for the root table. id, created_at, updated_at are ignored if provided.
            example:
              entityName: Recipe
              row:
                title: Cacio e Pepe
                cuisine_type: Italian
                difficulty: easy
                servings: 2
      responses:
        '200':
          description: Entity created
          content:
            application/json:
              example:
                success: true
                entityName: Recipe
                id: 8
                row:
                  id: 8
                  title: Cacio e Pepe
                  cuisine_type: Italian
                  difficulty: easy
                  created_at: "2026-03-19T14:00:00.000Z"
        '400':
          description: Validation error — unknown column or missing required field
        '404':
          description: Entity name not registered in PGC_EntitySchema
        '409':
          description: Unique constraint violation
        '500':
          description: Insert failed

  /api/v1/serv/entity/updateEntity:
    post:
      summary: UPDATE an entity row — patch or full replace
      description: >
        Updates the entity's root table row identified by id.

        Two modes:
          patch   (default) — sets only the fields provided, leaves all others unchanged.
                              Use for targeted field changes (e.g. change difficulty only).
          replace           — sets ALL non-system fields from the provided data,
                              resetting any omitted fields to null.
                              Use when replacing an entire recipe with a new version
                              while preserving id and child relationships (tags, ingredients).
                              System columns (id, created_at, updated_at) are never overwritten.

        id is required in both modes. Child rows are not affected — manage them
        via their own entity operations.
      tags: [SERV-Entity]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entityName, id, updates]
              properties:
                entityName:
                  type: string
                  example: Recipe
                id:
                  type: integer
                  example: 5
                updates:
                  type: object
                  description: Column/value pairs to set. In replace mode, omitted non-system columns are set to null.
                mode:
                  type: string
                  enum: [patch, replace]
                  default: patch
            examples:
              patch:
                summary: Change difficulty only
                value:
                  entityName: Recipe
                  id: 5
                  updates:
                    difficulty: easy
              replace:
                summary: Replace entire recipe content
                value:
                  entityName: Recipe
                  id: 5
                  mode: replace
                  updates:
                    title: Spaghetti Carbonara (Revised)
                    description: Lighter version with less guanciale
                    difficulty: easy
                    cuisine_type: Italian
                    servings: 2
      responses:
        '200':
          description: Entity updated
          content:
            application/json:
              example:
                success: true
                entityName: Recipe
                id: 5
                mode: patch
                row:
                  id: 5
                  title: Spaghetti Carbonara
                  difficulty: easy
                  updated_at: "2026-03-19T15:00:00.000Z"
        '400':
          description: Validation error — unknown column, missing id or updates
        '404':
          description: Entity not registered in PGC_EntitySchema, or id not found
        '500':
          description: Update failed

  /api/v1/serv/entity/upsertEntity:
    post:
      summary: INSERT or UPDATE — current data wins on conflict
      description: >
        Inserts the row if it does not exist; updates all provided fields if it does.
        Uses PostgreSQL INSERT ... ON CONFLICT (upsert_key) DO UPDATE SET.

        upsert_key is defined in PGC_EntitySchema — the column(s) forming the
        natural key for this entity (e.g. ["ticker"] for Stock, ["title"] for Recipe).
        If PGC_EntitySchema.upsert_key is empty or null for this entity, the
        endpoint returns 400 — upsert is not supported for that entity.

        System columns (id, created_at) are never overwritten on conflict.
        updated_at is always refreshed on conflict.

        Primary use case: syncing external data where the caller does not know
        or care whether the record already exists (e.g. stock price updates,
        inventory level sync).
      tags: [SERV-Entity]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entityName, row]
              properties:
                entityName:
                  type: string
                  example: Stock
                row:
                  type: object
                  description: Full row data. upsert_key column(s) must be present.
            example:
              entityName: Stock
              row:
                ticker: AAPL
                company_name: Apple Inc.
                sector: Technology
                last_price: 198.45
      responses:
        '200':
          description: Row inserted or updated — check wasInserted field
          content:
            application/json:
              examples:
                inserted:
                  summary: New row created
                  value:
                    success: true
                    entityName: Stock
                    wasInserted: true
                    row:
                      id: 12
                      ticker: AAPL
                      company_name: Apple Inc.
                      last_price: 198.45
                updated:
                  summary: Existing row updated
                  value:
                    success: true
                    entityName: Stock
                    wasInserted: false
                    row:
                      id: 3
                      ticker: AAPL
                      company_name: Apple Inc.
                      last_price: 198.45
        '400':
          description: >
            upsert_key not defined for this entity, upsert_key column missing
            from row, or unknown column name
        '404':
          description: Entity name not registered in PGC_EntitySchema
        '500':
          description: Upsert failed

  /api/v1/serv/entity/deleteEntity:
    post:
      summary: DELETE an entity row by id
      description: >
        Deletes the root table row by id. PostgreSQL CASCADE handles all child
        rows in related tables (e.g. deleting a Recipe cascades to
        PGD_RecipeTags and PGD_RecipeIngredients automatically via FK constraints).

        Gated by PGC_TableMap.allow_delete for the root_table — returns 403
        if deletion is not permitted. All PGD tables have allow_delete: true
        by default.

        The caller never needs to manage child row deletion manually.
      tags: [SERV-Entity]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entityName, id]
              properties:
                entityName:
                  type: string
                  example: Recipe
                id:
                  type: integer
                  example: 5
            example:
              entityName: Recipe
              id: 5
      responses:
        '200':
          description: Entity deleted — deletedCount is 0 if id was not found
          content:
            application/json:
              examples:
                deleted:
                  summary: Entity deleted
                  value:
                    success: true
                    entityName: Recipe
                    id: 5
                    deletedCount: 1
                not_found:
                  summary: Id not found — not an error
                  value:
                    success: true
                    entityName: Recipe
                    id: 999
                    deletedCount: 0
        '403':
          description: allow_delete is false for this entity's root table
        '404':
          description: Entity name not registered in PGC_EntitySchema
        '500':
          description: Delete failed
