openapi: 3.1.0
info:
  title: evolving-mind-ai
  version: 3.3.2
  description: >
    Self-evolving cognitive automation system.
    Slack → Lambda → PostgreSQL → LLM pipeline.
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: https://enwwi5aulf.execute-api.us-east-2.amazonaws.com/Prod
    description: AWS API Gateway — us-east-2

# ---------------------------------------------------------------------------
# Reusable components
# ---------------------------------------------------------------------------
components:
  parameters:
    CorrelationId:
      name: x-correlation-id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Client-supplied trace ID — generated if omitted

  schemas:
    CorrelationResponse:
      type: object
      properties:
        correlationId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string

    ColumnDefinition:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          example: recipe_id
        type:
          type: string
          enum:
            - serial
            - bigserial
            - text
            - varchar
            - integer
            - bigint
            - smallint
            - boolean
            - numeric
            - decimal
            - real
            - double precision
            - jsonb
            - json
            - timestamptz
            - timestamp
            - date
            - time
            - uuid
        primaryKey:
          type: boolean
        nullable:
          type: boolean
        unique:
          type: boolean
        default:
          type: string
          example: "now()"

    ForeignKeyDefinition:
      type: object
      required: [name, column, references]
      properties:
        name:
          type: string
        column:
          type: string
        references:
          type: object
          properties:
            table:
              type: string
            column:
              type: string
        onDelete:
          type: string
          enum: [CASCADE, RESTRICT, SET NULL, NO ACTION]
          default: RESTRICT

    ConstraintDefinition:
      type: object
      required: [type, name]
      properties:
        type:
          type: string
          enum: [unique, check]
        name:
          type: string
        columns:
          type: array
          items:
            type: string
        expression:
          type: string

    TriggerDefinition:
      type: object
      required: [name, timing, function]
      properties:
        name:
          type: string
        timing:
          type: string
          enum: [BEFORE UPDATE, BEFORE INSERT, AFTER UPDATE, AFTER INSERT]
        function:
          type: string
          example: set_updated_at()

    SchemaRow:
      type: object
      properties:
        id:
          type: integer
        table_name:
          type: string
        target:
          type: string
          enum: [pgc, pgd]
        description:
          type: string
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnDefinition'
        foreign_keys:
          type: array
          items:
            $ref: '#/components/schemas/ForeignKeyDefinition'
        constraints:
          type: array
          items:
            $ref: '#/components/schemas/ConstraintDefinition'
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/TriggerDefinition'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time


    ShutdownResult:
      type: object
      description: Result of a /shutdown operation
      properties:
        success:
          type: boolean
          example: true
        cancelledCount:
          type: integer
          description: Number of runs cancelled — 0 means no active runs existed
          example: 1
        cancelled:
          type: array
          items:
            type: object
            properties:
              workflowRunId:
                type: integer
                example: 42
              workflowName:
                type: string
                example: create_domain
              stoppedAtStep:
                type: integer
                description: >
                  Index of the execution stack step that was active when cancelled.
                  Null when the run had not yet started executing steps.
                example: 3

    FilterItem:
      type: object
      description: >
        A single filter predicate for SERV-Table DML operations (getRows, updateRows, deleteRows).
        Column names are validated against PGC_Schema for the target table.
        Operators is_null and not_null require no value field.
        Operator in requires value to be an array.
      required: [column, op]
      properties:
        column:
          type: string
          example: status
        op:
          type: string
          enum: [eq, neq, gt, gte, lt, lte, like, in, is_null, not_null]
          example: eq
        value:
          description: >
            Required for all operators except is_null and not_null.
            Must be an array when op is in.
          example: active

    Callback:
      type: object
      description: Provider-agnostic UI callback routing
      required: [provider, channel]
      properties:
        provider:
          type: string
          enum: [slack]
          example: slack
        channel:
          type: string
          example: C0AEJ87JSKF
        threadId:
          type: string
          example: "1234567890.123456"

    ValidationErrorDetail:
      type: object
      description: Single Ajv validation error
      properties:
        instancePath:
          type: string
          example: "/tables/2/constraints/0"
        schemaPath:
          type: string
        keyword:
          type: string
          example: required
        params:
          type: object
        message:
          type: string
          example: "must have required property 'expression'"

    ReviewOutputRequest:
      type: object
      required: [intentCategory, output]
      properties:
        intentCategory:
          type: string
          description: PGC_Prompt.intent_category — used to fetch output_schema for validation
          example: create_domain
        output:
          type: object
          description: The LLM-generated JSON to validate
        outputType:
          type: string
          enum: [json, js]
          default: json
          description: >
            json — validate against PGC_Prompt.output_schema using Ajv.
            js   — parse with acorn AST gate + vm.runInNewContext sandbox execution.
        testInput:
          type: object
          description: >
            Required when outputType is js. Passed as sandbox context for in-situ execution.
        traceId:
          type: string
          format: uuid

    ReviewOutputResponse:
      type: object
      properties:
        valid:
          type: boolean
        intentCategory:
          type: string
        attempt:
          type: integer
          description: Which attempt produced a valid result (1 or 2)
        correctedOutput:
          type: object
          description: Present only when attempt 2 succeeded — the LLM-corrected output
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorDetail'
          description: Ajv errors from the failed attempt — present only when valid is false
        errorLogged:
          type: boolean
          description: Whether the failure was written to PGC_Prompt.error_log
        traceId:
          type: string
          format: uuid

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # ── UI / Slackbot ──────────────────────────────────────────────────────────

  /api/v1/ui/slack/ping-api:
    post:
      summary: Slackbot health check
      description: Validates Slack → SlackbotFunction wiring. No DB, SQS, or LLM calls.
      tags: [Ping]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Pong
          content:
            application/json:
              example:
                success: true
                message: "🤖 ping-api — slackbot alive"
                correlationId: "abc-123"

  /api/v1/ui/slack/ping-sqs:
    post:
      summary: SQS round-trip ping
      description: >
        Validates Slack → SQS WorkflowQueue → ProcFunction
        → SQS CallbackResults → SlackCallbackListenerFunction → Slack thread.
        ACK posted via chat.postMessage. Threaded reply arrives ~5s later.
      tags: [Ping]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: ACK accepted — result delivered to Slack thread

  /api/v1/ui/slack/ping-llm:
    post:
      summary: LLM round-trip ping
      description: Validates Slack → SlackbotFunction → ProcFunction → Perplexity → Slack.
      tags: [Ping]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Fortune cookie from LLM returned

  /api/v1/ui/slack/ping-e2e:
    post:
      summary: Full end-to-end ping
      description: >
        Validates full chain — Slack → SQS → ProcFunction
        → ServFunction (ping-db) → SQS CallbackResults → SlackCallbackListenerFunction → Slack thread.
        Returns RDS PostgreSQL version string in thread.
      tags: [Ping]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: RDS version string delivered to Slack thread

  # ── PROC ───────────────────────────────────────────────────────────────────

  /api/v1/proc/ping-llm:
    post:
      summary: Direct LLM ping (curl)
      description: Validates PROC Lambda + LLM provider. No Slack or SQS.
      tags: [Ping]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        content:
          application/json:
            example:
              test: ping
      responses:
        '200':
          description: Fortune cookie from LLM
          content:
            application/json:
              example:
                success: true
                message: "Your Lambda will achieve enlightenment 🍪"
                correlationId: "abc-123"

  # ── SERV ───────────────────────────────────────────────────────────────────

  /api/v1/serv/ping-db:
    get:
      summary: PostgreSQL health check
      description: Validates ServFunction → PGC + PGD connectivity. Returns version strings.
      tags: [Ping]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Both databases reachable
          content:
            application/json:
              example:
                success: true
                pgc:
                  reachable: true
                  version: "PostgreSQL 16.6 on aarch64..."
                pgd:
                  reachable: true
                  version: "PostgreSQL 16.6 on aarch64..."
        '500':
          description: One or both databases unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/serv/schema/createTable:
    post:
      summary: Create a table + register in PGC_Schema
      description: >
        Executes DDL on target database (pgc or pgd), writes metadata row
        to PGC_Schema, registers in PGC_TableMap. Optionally notifies Slack.
        Column types are validated against a security whitelist before execution.
      tags: [SERV-Schema]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tableName, target, columns]
              properties:
                tableName:
                  type: string
                  pattern: '^(PGC|PGD)_[A-Za-z][A-Za-z0-9_]*$'
                  example: PGD_Recipes
                target:
                  type: string
                  enum: [pgc, pgd]
                description:
                  type: string
                columns:
                  type: array
                  items:
                    $ref: '#/components/schemas/ColumnDefinition'
                foreignKeys:
                  type: array
                  items:
                    $ref: '#/components/schemas/ForeignKeyDefinition'
                constraints:
                  type: array
                  items:
                    $ref: '#/components/schemas/ConstraintDefinition'
                triggers:
                  type: array
                  items:
                    $ref: '#/components/schemas/TriggerDefinition'
            example:
              tableName: PGD_Recipes
              target: pgd
              description: Recipe domain table
              columns:
                - { name: id,         type: serial,      primaryKey: true }
                - { name: name,       type: text,        nullable: false }
                - { name: created_at, type: timestamptz, nullable: false, default: "now()" }
      responses:
        '200':
          description: Table created and registered
          content:
            application/json:
              example:
                success: true
                tableName: PGD_Recipes
                target: pgd
                schemaId: 5
                createdAt: "2026-03-11T15:18:24.000Z"
        '400':
          description: Validation error — invalid table name, missing fields, disallowed type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Table already exists in PGC_Schema
        '500':
          description: DDL execution or PGC write failed

  /api/v1/serv/schema/listTables:
    post:
      summary: List all tables in PGC_Schema
      description: Returns all registered tables, optionally filtered by target (pgc or pgd).
      tags: [SERV-Schema]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                target:
                  type: string
                  enum: [pgc, pgd]
                  description: Optional filter
            example:
              target: pgd
      responses:
        '200':
          description: Table list
          content:
            application/json:
              example:
                success: true
                count: 4
                tables:
                  - { id: 1, table_name: PGC_Schema, target: pgc }
                  - { id: 2, table_name: PGC_TableMap, target: pgc }

  /api/v1/serv/schema/getTable:
    post:
      summary: Get one table definition from PGC_Schema
      tags: [SERV-Schema]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tableName]
              properties:
                tableName:
                  type: string
            example:
              tableName: PGC_Schema
      responses:
        '200':
          description: Full schema row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaRow'
        '404':
          description: Table not found in PGC_Schema

  /api/v1/serv/schema/updateTable:
    post:
      summary: Update metadata in PGC_Schema
      description: >
        Updates description, columns, foreign_keys, constraints, or triggers
        in PGC_Schema. Does not execute ALTER TABLE — metadata only.
      tags: [SERV-Schema]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tableName]
              properties:
                tableName:
                  type: string
                description:
                  type: string
                columns:
                  type: array
                  items:
                    $ref: '#/components/schemas/ColumnDefinition'
                foreignKeys:
                  type: array
                  items:
                    $ref: '#/components/schemas/ForeignKeyDefinition'
            example:
              tableName: PGD_Recipes
              description: Updated recipe domain table description
      responses:
        '200':
          description: Metadata updated
        '400':
          description: No updatable fields provided
        '404':
          description: Table not found

  /api/v1/serv/schema/deleteTable:
    post:
      summary: Drop table + remove from PGC_Schema
      description: >
        Drops the physical table (CASCADE) and removes rows from
        PGC_Schema and PGC_TableMap. Protected system tables
        (PGC_Schema, PGC_TableMap, PGC_EntitySchema, PGC_DomainHelp)
        are rejected with 403.
      tags: [SERV-Schema]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tableName]
              properties:
                tableName:
                  type: string
            example:
              tableName: PGD_Recipes
      responses:
        '200':
          description: Table dropped and registry entries removed
        '403':
          description: Protected system table — cannot be dropped
        '404':
          description: Table not found in PGC_Schema
        '500':
          description: Drop or registry cleanup failed

  # ── SERV-Table ─────────────────────────────────────────────────────────────

  /api/v1/serv/table/getRows:
    post:
      summary: SELECT rows from a registered table
      description: >
        Parameterised SELECT gated by PGC_TableMap. Supports filters, orderBy,
        and limit. Column names in filters are validated against PGC_Schema.
        Filter operators — eq, neq, gt, gte, lt, lte, like, in, is_null, not_null.
      tags: [SERV-Table]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tableName]
              properties:
                tableName:
                  type: string
                  pattern: '^(PGC|PGD)_[A-Za-z][A-Za-z0-9_]*$'
                  example: PGC_Prompt
                filters:
                  type: array
                  items:
                    $ref: '#/components/schemas/FilterItem'
                orderBy:
                  type: object
                  properties:
                    column:
                      type: string
                    direction:
                      type: string
                      enum: [asc, desc]
                      default: asc
                limit:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  default: 100
            example:
              tableName: PGC_Prompt
              filters:
                - { column: intent_category, op: eq, value: create_domain }
                - { column: was_successful,  op: not_null }
              orderBy: { column: version, direction: desc }
              limit: 10
      responses:
        '200':
          description: Matching rows returned
          content:
            application/json:
              example:
                success: true
                tableName: PGC_Prompt
                count: 1
                rows:
                  - id: 1
                    intent_category: create_domain
                    prompt_text: "You are a schema designer..."
                    version: 1
        '400':
          description: Validation error — bad table name, unknown column, disallowed operator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Table not registered in PGC_TableMap
        '500':
          description: Query failed

  /api/v1/serv/table/insertRow:
    post:
      summary: INSERT a single row into a registered table
      description: >
        Single INSERT gated by PGC_TableMap allow_insert flag.
        Column names validated against PGC_Schema. Returns full inserted row.
      tags: [SERV-Table]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tableName, row]
              properties:
                tableName:
                  type: string
                  pattern: '^(PGC|PGD)_[A-Za-z][A-Za-z0-9_]*$'
                  example: PGC_DomainHelp
                row:
                  type: object
                  description: Column/value pairs to insert
            example:
              tableName: PGC_DomainHelp
              row:
                domain: recipes
                aliases: ["recipe", "cooking"]
                description: Recipe management domain
                commands: []
      responses:
        '200':
          description: Row inserted
          content:
            application/json:
              example:
                success: true
                tableName: PGC_DomainHelp
                row:
                  id: 1
                  domain: recipes
        '400':
          description: Validation error — bad table name or unknown column
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: INSERT not permitted on this table
        '404':
          description: Table not registered in PGC_TableMap
        '500':
          description: Insert failed

  /api/v1/serv/table/updateRows:
    post:
      summary: UPDATE rows in a registered table
      description: >
        Parameterised UPDATE gated by PGC_TableMap allow_update flag.
        Column names in both updates and filters are validated against PGC_Schema.
        filters is required and must be non-empty — unfiltered mass UPDATE is not permitted.
        Returns all updated rows via RETURNING *.
      tags: [SERV-Table]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tableName, filters, updates]
              properties:
                tableName:
                  type: string
                  pattern: '^(PGC|PGD)_[A-Za-z][A-Za-z0-9_]*$'
                  example: PGC_WorkflowRun
                filters:
                  type: array
                  minItems: 1
                  description: Required — must target specific rows. Unfiltered UPDATE is rejected.
                  items:
                    $ref: '#/components/schemas/FilterItem'
                updates:
                  type: object
                  description: Column/value pairs to set. jsonb values are serialized automatically.
                  example:
                    status: cancelled
            example:
              tableName: PGC_WorkflowRun
              filters:
                - { column: id,     op: eq,  value: 42 }
                - { column: status, op: eq,  value: active }
              updates:
                status: cancelled
      responses:
        '200':
          description: Rows updated — updatedCount is 0 when filters match nothing
          content:
            application/json:
              examples:
                rows_updated:
                  summary: One or more rows updated
                  value:
                    success: true
                    tableName: PGC_WorkflowRun
                    updatedCount: 1
                    rows:
                      - id: 42
                        status: cancelled
                        workflow_id: 3
                        created_at: "2026-03-19T10:00:00.000Z"
                no_match:
                  summary: Filters matched no rows
                  value:
                    success: true
                    tableName: PGC_WorkflowRun
                    updatedCount: 0
                    rows: []
        '400':
          description: >
            Validation error — missing filters, empty filters, bad table name,
            unknown column in updates or filters, disallowed operator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: UPDATE not permitted on this table (allow_update is false in PGC_TableMap)
        '404':
          description: Table not registered in PGC_TableMap
        '500':
          description: Update failed

  /api/v1/serv/table/deleteRows:
    post:
      summary: DELETE rows from a registered table
      description: >
        Parameterised DELETE gated by PGC_TableMap allow_delete flag.
        Column names in filters are validated against PGC_Schema.
        filters is required and must be non-empty — unfiltered mass DELETE is not permitted.
        Note: allow_delete is false on all PGC system tables in the seed data —
        domain data tables (PGD_*) are the expected use case.
      tags: [SERV-Table]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tableName, filters]
              properties:
                tableName:
                  type: string
                  pattern: '^(PGC|PGD)_[A-Za-z][A-Za-z0-9_]*$'
                  example: PGD_Recipes
                filters:
                  type: array
                  minItems: 1
                  description: Required — must target specific rows. Unfiltered DELETE is rejected.
                  items:
                    $ref: '#/components/schemas/FilterItem'
            example:
              tableName: PGD_Recipes
              filters:
                - { column: id, op: eq, value: 7 }
      responses:
        '200':
          description: Rows deleted — deletedCount is 0 when filters match nothing
          content:
            application/json:
              examples:
                rows_deleted:
                  summary: One or more rows deleted
                  value:
                    success: true
                    tableName: PGD_Recipes
                    deletedCount: 1
                no_match:
                  summary: Filters matched no rows
                  value:
                    success: true
                    tableName: PGD_Recipes
                    deletedCount: 0
        '400':
          description: >
            Validation error — missing filters, empty filters, bad table name,
            unknown column in filters, disallowed operator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: DELETE not permitted on this table (allow_delete is false in PGC_TableMap)
        '404':
          description: Table not registered in PGC_TableMap
        '500':
          description: Delete failed

  /api/v1/ui/slack/shutdown:
    post:
      summary: Slack /shutdown command handler
      description: >
        Handles the /shutdown Slack slash command. Synchronous — unlike other
        slash commands, this does NOT enqueue to SQS. SlackbotFunction calls
        POST /proc/shutdown directly via HTTP fetch and returns the result
        inline within Slack's 3s response window.

        Slack command syntax:
          /shutdown            — cancel all active workflow runs
          /shutdown <runId>    — cancel a specific run by PGC_WorkflowRun.id

        Flow:
          1. Slack POSTs to this endpoint
          2. SlackbotFunction verifies Slack signing secret
          3. Parses text field — empty = cancel all, integer = cancel specific run
          4. Calls POST /proc/shutdown synchronously via HTTP fetch to PROC_API_URL
          5. Formats ShutdownResult as a Slack message and returns inline (response_type: ephemeral)
          6. No SQS enqueue, no thread — response is immediate and visible only to the caller

        Ephemeral response — only the user who ran /shutdown sees the result.
        This is intentional: shutdown is an operator action, not a team notification.
      tags: [UI-Slack]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [command, text, user_id, channel_id]
              properties:
                command:
                  type: string
                  example: /shutdown
                text:
                  type: string
                  description: Empty string (cancel all) or integer runId (cancel specific)
                  example: "42"
                user_id:
                  type: string
                  example: U012AB3CD
                channel_id:
                  type: string
                  example: C0AEJ87JSKF
      responses:
        '200':
          description: >
            Shutdown result returned inline. cancelledCount: 0 when no active runs exist —
            this is not an error.
          content:
            application/json:
              examples:
                runs_cancelled:
                  summary: One or more runs cancelled
                  value:
                    response_type: ephemeral
                    text: "🛑 Shutdown complete — 2 run(s) cancelled: create_domain (run 42), create_domain (run 43)"
                no_active_runs:
                  summary: No active workflows
                  value:
                    response_type: ephemeral
                    text: "✅ No active workflows to cancel"
                specific_run_cancelled:
                  summary: Specific run cancelled
                  value:
                    response_type: ephemeral
                    text: "🛑 Run 42 cancelled (create_domain, was at step 3)"
                specific_run_not_found:
                  summary: Specific run not found or already inactive
                  value:
                    response_type: ephemeral
                    text: "✅ Run 42 is not active (already completed, cancelled, or not found)"
        '400':
          description: Invalid Slack signature or text is not a valid integer when provided
        '500':
          description: PROC /shutdown call failed or timed out

  # ── UI / Slack — command + interactive ────────────────────────────────────

  /api/v1/ui/slack/command:
    post:
      summary: Slack slash command receiver
      description: >
        Receives all Slack slash commands (/create-domain, /shutdown, /ping-*, etc.).
        Validates Slack request signature, ACKs immediately with 200, then enqueues
        a message to SQS WorkflowQueue for async processing by ProcFunction.
        Slack requires a response within 3 seconds — this endpoint always responds
        within 1s. The threaded result arrives via SlackCallbackListenerFunction.
      tags: [UI-Slack]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [command, text, user_id, channel_id]
              properties:
                command:
                  type: string
                  example: /create-domain
                text:
                  type: string
                  example: recipes
                user_id:
                  type: string
                  example: U012AB3CD
                channel_id:
                  type: string
                  example: C0AEJ87JSKF
                thread_ts:
                  type: string
                  example: "1234567890.123456"
      responses:
        '200':
          description: >
            ACK — command accepted. Result will be posted to the Slack thread.
          content:
            application/json:
              example:
                response_type: in_channel
                text: "🧠 Designing domain for *recipes* — watch this thread for results"
        '400':
          description: Invalid Slack signature or missing required fields
        '500':
          description: Failed to enqueue to SQS WorkflowQueue

  /api/v1/ui/slack/interactive:
    post:
      summary: Slack interactive payload handler
      description: >
        Receives interactive component payloads from Slack — button clicks,
        modal submissions, and overflow menu selections. Used exclusively for
        human_gate responses in the workflow execution stack.

        Flow:
          1. User clicks button in a Slack Block Kit message (e.g. "✅ Confirm")
          2. Slack POSTs a URL-encoded payload to this endpoint
          3. SlackbotFunction validates the Slack signature
          4. Parses the payload — extracts workflowRunId, action, and user response
          5. Enqueues { type: WORKFLOW_STEP, action: resume_gate, response } to WorkflowQueue
          6. Returns 200 immediately — Slack requires response within 3s

        The Step Processor picks up the resume_gate message and pops the
        human_gate frame from the execution stack, routing based on the user response.
      tags: [UI-Slack]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  type: string
                  description: >
                    URL-encoded JSON string from Slack containing action details.
                    Parsed fields used internally:
                    type (block_actions | view_submission),
                    actions[0].action_id,
                    actions[0].value (encodes workflowRunId + user response),
                    user.id, channel.id, message.ts
      responses:
        '200':
          description: >
            Interactive action acknowledged. Stack will resume asynchronously.
          content:
            application/json:
              example: {}
        '400':
          description: Invalid Slack signature or malformed payload
        '404':
          description: workflowRunId not found or run not in awaiting_human_gate status
        '500':
          description: Failed to enqueue resume_gate message to WorkflowQueue

  # ── PROC — business logic endpoints ───────────────────────────────────────

  /api/v1/proc/create-domain:
    post:
      summary: Design and create a new user domain
      description: >
        Transport-agnostic endpoint — called identically via HTTP (curl/test)
        or SQS (WorkflowQueue async message from Slack).

        Reads the create_domain prompt from PGC_Prompt, calls the LLM to design
        a full relational schema, validates the scaffold via review-output (Ajv),
        creates each PGD table via SERV-Schema createTable, and registers the
        domain in PGC_DomainHelp.

        On SQS delivery, result is enqueued to SYSSQSCallbackResults for
        SlackCallbackListenerFunction to post as a threaded reply.
      tags: [PROC]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userInput]
              properties:
                userInput:
                  type: string
                  description: >
                    Free-form natural language description of the domain.
                    LLM infers a clean snake_case domain name from this.
                  example: recipes with ingredients and nutritional info
                callback:
                  $ref: '#/components/schemas/Callback'
                traceId:
                  type: string
                  format: uuid
            example:
              userInput: recipes with ingredients and nutritional info
              callback:
                provider: slack
                channel: C0AEJ87JSKF
                threadId: "1234567890.123456"
      responses:
        '200':
          description: Domain created successfully
          content:
            application/json:
              example:
                success: true
                domainName: recipes
                tables:
                  - { tableName: PGD_Recipes,     status: created }
                  - { tableName: PGD_Ingredients,  status: created }
                completedAt: "2026-03-18T10:46:45.870Z"
        '400':
          description: userInput is required
        '500':
          description: LLM call, validation, or DDL execution failed

  /api/v1/proc/shutdown:
    post:
      summary: Emergency stop — cancel active workflow runs
      description: >
        Immediately cancels all active workflow runs for this instance, or a
        specific run by ID.

        Steps performed:
          1. Calls SERV getRows on PGC_WorkflowRun — filters by status=active
             and optionally by id=workflowRunId
          2. Calls SERV updateRows on PGC_WorkflowRun — sets status=cancelled
             for each matching run (non-empty filters enforced by updateRows gate)
          3. Enqueues { type: WORKFLOW_STEP, action: cancel, workflowRunId } to
             WorkflowQueue for each cancelled run — so any in-flight SQS step
             is discarded when the Step Processor checks status before executing
          4. Returns ShutdownResult — cancelledCount: 0 when no active runs exist

        Called synchronously by SlackbotFunction on /shutdown command —
        no SQS hop. Must respond within Slack's 3s window.

        NOTE: Step Processor (Phase 2 item 5) MUST check PGC_WorkflowRun.status
        as its first action before executing any step. That check is what gives
        the cancel signal its effect. This is a hard constraint on the Step Processor design.
      tags: [PROC]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workflowRunId:
                  type: integer
                  description: >
                    Specific run to cancel. Omit to cancel ALL active runs.
                callback:
                  $ref: '#/components/schemas/Callback'
                traceId:
                  type: string
                  format: uuid
            examples:
              cancel_all:
                summary: Cancel all active runs
                value:
                  callback:
                    provider: slack
                    channel: C0AEJ87JSKF
                    threadId: "1234567890.123456"
              cancel_specific:
                summary: Cancel a specific run
                value:
                  workflowRunId: 42
                  callback:
                    provider: slack
                    channel: C0AEJ87JSKF
                    threadId: "1234567890.123456"
      responses:
        '200':
          description: Shutdown complete — cancelledCount is 0 when no active runs exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShutdownResult'
              examples:
                runs_cancelled:
                  summary: One or more runs cancelled
                  value:
                    success: true
                    cancelledCount: 2
                    cancelled:
                      - { workflowRunId: 42, workflowName: create_domain, stoppedAtStep: 3 }
                      - { workflowRunId: 43, workflowName: create_domain, stoppedAtStep: 1 }
                no_active_runs:
                  summary: No active workflows to cancel
                  value:
                    success: true
                    cancelledCount: 0
                    cancelled: []
        '500':
          description: SERV getRows, updateRows, or SQS enqueue failed

  /api/v1/proc/review-output:
    post:
      summary: Right-brain output validation — Ajv JSON Schema + in-situ JS sandbox
      description: >
        Validates LLM-generated output before it is passed to any downstream step
        (DDL, SQS payload, workflow state write). Implements the repeat-until-correct
        loop defined in architecture Section 6.10.

        For JSON output (outputType: json):
          - Fetches PGC_Prompt.output_schema for the given intentCategory
          - Validates the output against the schema using Ajv
          - If invalid: injects Ajv errors into a correction prompt, calls LLM once more
          - If attempt 2 also fails: writes to PGC_Prompt.error_log, returns valid: false

        For JS output (outputType: js):
          - Parses the generated code with acorn (AST gate — syntax validation)
          - Executes in vm.runInNewContext() sandbox with hard 500ms timeout
          - Validates output shape against PGC_StepType.output_schema
          - Same 2-attempt correction loop applies

        Maximum 2 LLM correction attempts. Never an unbounded loop.
        All failures written to PGC_Prompt.error_log regardless of recovery outcome.
      tags: [PROC]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewOutputRequest'
            examples:
              json_validation:
                summary: Validate LLM scaffold JSON
                value:
                  intentCategory: create_domain
                  outputType: json
                  output:
                    domain: recipes
                    tables:
                      - tableName: PGD_Recipes
                        target: pgd
                        columns:
                          - { name: id, type: serial, primaryKey: true }
                  traceId: "ae9a8899-94a5-4a16-8dc1-803764d373d7"
              js_validation:
                summary: Validate LLM-generated JS transform
                value:
                  intentCategory: js_transform_merge_tables
                  outputType: js
                  output: "function transform(input) { return { merged: input.tables }; }"
                  testInput: { tables: ["PGD_A", "PGD_B"] }
                  traceId: "ae9a8899-94a5-4a16-8dc1-803764d373d7"
      responses:
        '200':
          description: Validation result — check valid field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewOutputResponse'
              examples:
                valid_first_attempt:
                  summary: Valid on first attempt
                  value:
                    valid: true
                    intentCategory: create_domain
                    attempt: 1
                    traceId: "ae9a8899-94a5-4a16-8dc1-803764d373d7"
                valid_after_correction:
                  summary: Invalid attempt 1, corrected on attempt 2
                  value:
                    valid: true
                    intentCategory: create_domain
                    attempt: 2
                    correctedOutput:
                      domain: recipes
                      tables: []
                    traceId: "ae9a8899-94a5-4a16-8dc1-803764d373d7"
                invalid_both_attempts:
                  summary: Both attempts failed — run halted
                  value:
                    valid: false
                    intentCategory: create_domain
                    attempt: 2
                    errors:
                      - instancePath: "/tables/2/constraints/0"
                        keyword: required
                        message: "must have required property 'expression'"
                    errorLogged: true
                    traceId: "ae9a8899-94a5-4a16-8dc1-803764d373d7"
        '400':
          description: Missing intentCategory or output, unknown outputType
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No PGC_Prompt row found for intentCategory
        '500':
          description: Validation infrastructure error (Ajv compile, vm sandbox, DB write)
