  /api/v1/ui/slack/interactive:
    post:
      summary: Slack interactive payload handler
      description: >
        Receives interactive component payloads from Slack — button clicks,
        modal submissions, and overflow menu selections. Used exclusively for
        human_gate responses in the workflow execution stack.

        Flow:
          1. User clicks button in a Slack Block Kit message (e.g. "✅ Confirm")
          2. Slack POSTs a URL-encoded payload to this endpoint
          3. SlackbotFunction validates the Slack signature
          4. Parses the payload — extracts workflowRunId, action, and user response
          5. Enqueues { type: WORKFLOW_STEP, action: resume_gate, response } to WorkflowQueue
          6. Returns 200 immediately — Slack requires response within 3s

        The Step Processor picks up the resume_gate message and pops the
        human_gate frame from the execution stack, routing based on the user response.
      tags: [UI-Slack]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  type: string
                  description: >
                    URL-encoded JSON string from Slack containing action details.
                    Parsed fields used internally:
                    type (block_actions | view_submission),
                    actions[0].action_id,
                    actions[0].value (encodes workflowRunId + user response),
                    user.id, channel.id, message.ts
      responses:
        '200':
          description: >
            Interactive action acknowledged. Stack will resume asynchronously.
          content:
            application/json:
              example: {}
        '400':
          description: Invalid Slack signature or malformed payload
        '404':
          description: workflowRunId not found or run not in awaiting_human_gate status
        '500':
          description: Failed to enqueue resume_gate message to WorkflowQueue
 
  /api/v1/ui/slack/mind:
    post:
      summary: /mind slash command — natural language intent entry point
      description: >
        Receives the /mind Slack slash command. This is the primary entry point
        for all natural language interaction with the brain — workflow invocation,
        domain CRUD, and heavy-lift creation requests all flow through here.

        Validates the Slack signing secret (HMAC-SHA256 + replay protection),
        then performs a session lookup before enqueuing:

          1. If thread_ts is present (reply in existing thread):
               → getRows PGC_Session where callback->>'threadId' = thread_ts
               → found: retrieve session_id, include in CLASSIFY_INTENT message
               → not found: generate new session_id UUID, PROC creates PGC_Session on receipt
          2. If thread_ts is absent (fresh /mind, no existing thread):
               → generate new session_id UUID
          3. Post ACK message to Slack (chat.postMessage) — ackTs becomes the thread root
          4. Enqueue CLASSIFY_INTENT to SQS WorkflowQueue:
               { type: CLASSIFY_INTENT, userInput, sessionId, callback: { provider, channel, threadId: ackTs } }
          5. Return 200 immediately — Slack 3s window

        The session lookup (step 1) is one getRows call to SERV.
        The session layer (PGC_Session, PGC_SessionEntry) is Phase 3 — until then,
        sessionId is generated fresh on every call and PROC ignores it.

        classify-intent.mjs picks up the CLASSIFY_INTENT message and runs the
        two-pass, domain-workflow-aware classification pipeline (Section 6.3).
      tags: [UI-Slack]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [command, text, user_id, channel_id]
              properties:
                command:
                  type: string
                  example: /mind
                text:
                  type: string
                  description: Free-form natural language input
                  example: show me my pasta recipes
                user_id:
                  type: string
                  example: U012AB3CD
                channel_id:
                  type: string
                  example: C0AEJ87JSKF
                thread_ts:
                  type: string
                  description: >
                    Present when the user typed /mind as a reply in an existing thread.
                    Used for session lookup. Absent on fresh /mind calls.
                  example: "1234567890.123456"
      responses:
        '200':
          description: >
            ACK — intent received. Classification and routing will be posted
            to the Slack thread asynchronously via SlackCallbackListenerFunction.
          content:
            application/json:
              examples:
                fresh_thread:
                  summary: Fresh /mind — new thread started
                  value:
                    response_type: in_channel
                    text: "Got it — thinking..."
                existing_thread:
                  summary: /mind in existing thread — session continues
                  value:
                    response_type: in_channel
                    text: "On it..."
        '400':
          description: Invalid Slack signature, missing text, or empty input
        '500':
          description: Session lookup, ACK post, or SQS enqueue failed

  /api/v1/ui/slack/create-workflow:
    post:
      summary: /create-workflow slash command — direct workflow creation entry point
      description: >
        Handles the /create-workflow Slack slash command. This is the direct entry
        point for workflow creation, bypassing the classify-intent pipeline entirely.

        Contrast with the /mind path: when a user types `/m create workflow Spanish
        vocabulary quiz`, classify-intent.mjs routes it as a heavy-lift CREATE_WORKFLOW
        with domain resolved via alias lookup. This endpoint handles the explicit
        `/create-workflow` command where no classification is needed.

        Flow:
          1. Slack POSTs to this endpoint
          2. SlackbotFunction verifies Slack signing secret (HMAC-SHA256 + replay protection)
          3. Extracts text field as userInput — required, returns 400 if empty
          4. Posts ACK message to Slack via chat.postMessage — ackTs becomes the thread root
             for all subsequent human gate prompts and result replies
          5. Enqueues CREATE_WORKFLOW to SQS WorkflowQueue:
               { type: CREATE_WORKFLOW, userInput, domain: null, callback: { provider, channel, threadId: ackTs } }
          6. Returns { statusCode: 200, body: '' } immediately — Slack 3s window

        domain is always null on this path — no alias lookup runs. The
        analyze_and_design_workflow LLM prompt (create_workflow step 7) extracts
        domain context from userInput. ProcFunction dispatches the SQS message to
        proc/create-workflow.mjs which creates the PGC_WorkflowRun with
