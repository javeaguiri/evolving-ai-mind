                text:
                  type: string
                  description: >
                    Free-form natural language description of the workflow to create.
                    Passed as userInput to proc/create-workflow.mjs unchanged.
                    The LLM infers domain, step structure, and workflow name from this.
                  example: Spanish vocabulary quiz
                user_id:
                  type: string
                  example: U012AB3CD
                channel_id:
                  type: string
                  example: C0AEJ87JSKF
      responses:
        '200':
          description: >
            ACK posted to Slack and CREATE_WORKFLOW enqueued. Returns empty body —
            all progress and gate prompts arrive as threaded Slack replies.
          content:
            application/json:
              example: {}
        '400':
          description: >
