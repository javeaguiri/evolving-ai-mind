openapi: 3.1.0
info:
  title: evolving-mind-ai
  version: 3.5.0
  description: >
    Self-evolving cognitive automation system.
    Slack → Lambda → PostgreSQL → LLM pipeline.
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: https://enwwi5aulf.execute-api.us-east-2.amazonaws.com/Prod
    description: AWS API Gateway — us-east-2

# ---------------------------------------------------------------------------
# Reusable components
# ---------------------------------------------------------------------------
components:
  parameters:
    CorrelationId:
      name: x-correlation-id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Client-supplied trace ID — generated if omitted

  schemas:
    CorrelationResponse:
      type: object
      properties:
        correlationId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string

    ColumnDefinition:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          example: recipe_id
        type:
          type: string
          enum:
            - serial
            - bigserial
            - text
            - varchar
            - integer
            - bigint
            - smallint
            - boolean
            - numeric
            - decimal
            - real
            - double precision
            - jsonb
            - json
            - timestamptz
            - timestamp
            - date
            - time
            - uuid
            - vector
        primaryKey:
          type: boolean
        nullable:
          type: boolean
        unique:
          type: boolean
        default:
          type: string
          example: "now()"
        embed_source:
          type: array
          description: >
            Vector columns only. Names of sibling columns whose concatenated values
            are used to compute the embedding. SERV automatically calls embedText()
            on insert and re-computes on update when any embed_source field changes.
            Callers never supply the vector value — it is always computed by SERV.
          items:
            type: string
          example: ["domain", "description", "aliases"]

    ForeignKeyDefinition:
      type: object
      required: [name, column, references]
      properties:
        name:
          type: string
        column:
          type: string
        references:
          type: object
          properties:
            table:
              type: string
            column:
              type: string
        onDelete:
          type: string
          enum: [CASCADE, RESTRICT, SET NULL, NO ACTION]
          default: RESTRICT

    ConstraintDefinition:
      type: object
      required: [type, name]
      properties:
        type:
          type: string
          enum: [unique, check]
        name:
          type: string
        columns:
          type: array
          items:
            type: string
        expression:
          type: string

    TriggerDefinition:
      type: object
      required: [name, timing, function]
      properties:
        name:
          type: string
        timing:
          type: string
          enum: [BEFORE UPDATE, BEFORE INSERT, AFTER UPDATE, AFTER INSERT]
        function:
          type: string
          example: set_updated_at()

    SchemaRow:
      type: object
      properties:
        id:
          type: integer
        table_name:
          type: string
        target:
          type: string
          enum: [pgc, pgd]
        description:
          type: string
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnDefinition'
        foreign_keys:
          type: array
          items:
            $ref: '#/components/schemas/ForeignKeyDefinition'
        constraints:
          type: array
          items:
            $ref: '#/components/schemas/ConstraintDefinition'
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/TriggerDefinition'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time


    EntityJoin:
      type: object
      description: Defines a JOIN from the root table to a related PGD table
      required: [table, on]
      properties:
        table:
          type: string
          description: Related PGD table name
          example: PGD_RecipeTags
        on:
          type: string
          description: >
            JOIN condition — references root table as "r" and joined table by its alias.
            Example: "r.id = t.recipe_id"
          example: "r.id = t.recipe_id"
        alias:
          type: string
          description: Table alias used in the ON clause and aggregation
          example: t
        type:
          type: string
          enum: [LEFT, INNER]
          default: LEFT

    EntityAggregation:
      type: object
      description: >
        Defines a jsonb_agg column to include in getEntity / listEntities output.
        Each aggregation pulls related rows from a joined table into a JSON array.
      required: [alias, outputKey]
      properties:
        alias:
          type: string
          description: Table alias matching the join alias
          example: t
        outputKey:
          type: string
          description: Key name in the returned entity object
          example: tags
        columns:
          type: array
          description: Which columns to include in the aggregated object. Omit for all (*)
          items:
            type: string
          example: [tag]

    EntitySchemaRow:
      type: object
      description: A row from PGC_EntitySchema — defines a business entity
      properties:
        id:
          type: integer
        entity_name:
          type: string
          example: Recipe
        description:
          type: string
        root_table:
          type: string
          example: PGD_Recipes
        joins:
          type: array
          items:
            $ref: '#/components/schemas/EntityJoin'
        aggregations:
          type: array
          items:
            $ref: '#/components/schemas/EntityAggregation'
        filters:
          type: array
          description: Default row-level filters always applied to this entity
          items:
            $ref: '#/components/schemas/FilterItem'
        upsert_key:
          type: array
          description: >
            Column name(s) forming the natural key for upsertEntity.
            Empty or null means upsert is not supported for this entity.
          items:
            type: string
          example: [ticker]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ShutdownResult:
      type: object
      description: Result of a /shutdown operation
      properties:
        success:
          type: boolean
          example: true
        cancelledCount:
          type: integer
          description: Number of runs cancelled — 0 means no active runs existed
          example: 1
        cancelled:
          type: array
          items:
            type: object
            properties:
              workflowRunId:
                type: integer
                example: 42
              workflowName:
                type: string
                example: create_domain
              stoppedAtStep:
                type: integer
                description: >
                  Index of the execution stack step that was active when cancelled.
                  Null when the run had not yet started executing steps.
                example: 3

    FilterItem:
      type: object
      description: >
        A single filter predicate for SERV-Table DML operations (getRows, updateRows, deleteRows).
        Column names are validated against PGC_Schema for the target table.
        Operators is_null and not_null require no value field.
        Operator in requires value to be an array.
      required: [column, op]
      properties:
        column:
          type: string
          example: status
        op:
          type: string
          enum: [eq, neq, gt, gte, lt, lte, like, in, is_null, not_null]
          example: eq
        value:
          description: >
            Required for all operators except is_null and not_null.
            Must be an array when op is in.
          example: active

    VectorSearch:
      type: object
      description: >
        pgvector cosine similarity search descriptor. When present on getRows,
        SERV embeds queryText using OpenAI text-embedding-3-small and ranks results
        by cosine similarity against the named vector column. Rows below the
        similarity threshold are excluded. Each result row gains a `similarity`
        float field (0–1, where 1 = identical).

        Can be combined with filters — regular filter conditions pre-qualify rows,
        vectorSearch then ranks the survivors. mutually exclusive with orderBy
        (vector distance ordering always takes precedence).

        The caller supplies plain text only. SERV owns all embedding operations.
      required: [column, queryText]
      properties:
        column:
          type: string
          description: Name of the vector column to search against. Must have type=vector in PGC_Schema.
          example: embedding
        queryText:
          type: string
          description: >
            Plain text to embed and compare. SERV calls embedText() and computes
            cosine similarity against every qualifying row.
          example: spanish flashcard quiz
        threshold:
          type: number
          format: float
          minimum: 0
          maximum: 1
          default: 0.75
          description: >
            Minimum cosine similarity for a row to be included in results.
            0 = accept everything, 1 = exact match only. Default 0.75.
          example: 0.75
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
          description: Maximum number of rows to return, ordered by descending similarity.
          example: 1

    Callback:
      type: object
      description: Provider-agnostic UI callback routing
      required: [provider, channel]
      properties:
        provider:
          type: string
          enum: [slack]
          example: slack
        channel:
          type: string
          example: C0AEJ87JSKF
        threadId:
          type: string
          example: "1234567890.123456"

    ValidationErrorDetail:
      type: object
      description: Single Ajv validation error
      properties:
        instancePath:
          type: string
          example: "/tables/2/constraints/0"
        schemaPath:
          type: string
        keyword:
          type: string
          example: required
        params:
          type: object
        message:
          type: string
          example: "must have required property 'expression'"

    ReviewOutputRequest:
      type: object
      required: [intentCategory, output]
      properties:
        intentCategory:
          type: string
          description: PGC_Prompt.intent_category — used to fetch output_schema for validation
          example: create_domain
        output:
          type: object
          description: The LLM-generated JSON to validate
        outputType:
          type: string
          enum: [json, js]
          default: json
          description: >
            json — validate against PGC_Prompt.output_schema using Ajv.
            js   — parse with acorn AST gate + vm.runInNewContext sandbox execution.
        testInput:
          type: object
          description: >
            Required when outputType is js. Passed as sandbox context for in-situ execution.
        traceId:
          type: string
          format: uuid

    SimulationDecision:
      type: object
      description: >
        A single decision at a branch point in a simulation path.
        One entry per gate step, failure point, or iterator outcome.
      required: [step, outcome]
      properties:
        step:
          type: string
          description: Step key this decision applies to (e.g. "3", "3d")
          example: "3"
        outcome:
          type: string
          enum: [success, failure, gate]
          description: >
            success — step completes normally, mock_output injected into local_state.
            failure — step throws, on_failure routing is taken.
            gate    — human_gate step, user_response and on_select are injected.
        user_response:
          type: string
          description: Required when outcome is gate. Matches one of the gate option actions.
          example: confirm
        on_select:
          type: string
          description: >
            Required when outcome is gate. The on_select value from the chosen option.
            Must be a valid routing token (next, cancel, end, step:N).
          example: "step:3d"
        output_key:
          type: string
          description: >
            For text_input gates only. The output_key the gate writes to.
          example: new_table_description
        value:
          description: >
            For text_input gates only. The value written to local_state[output_key].
          example: "A nutritional info table linking to PGD_Recipes"
        error:
          type: string
          description: For outcome=failure only. The simulated error message.
          example: "LLM returned invalid JSON"

    SimulationPath:
      type: object
      description: >
        A named execution path through a workflow. Describes every decision made
        at branch points so the simulator can advance local_state deterministically.
      required: [path_name, decisions, expected_terminal]
      properties:
        path_name:
          type: string
          description: Short identifier used in failure reports.
          example: happy_path
        decisions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SimulationDecision'
          description: >
            Ordered list of decisions. One entry per branch point encountered on
            this path (gates, failures, iterator outcomes). Steps with no branching
            (serv_insert, notify, end) do not require a decision entry.
        expected_terminal:
          type: string
          description: >
            The step key or terminal state the path should reach.
            Use "end" for normal completion, "cancelled" for cancel paths.
          example: end

    SimulationStepTransition:
      type: object
      description: local_state snapshot before and after a single simulated step
      properties:
        step:
          type: string
          example: "6"
        type:
          type: string
          example: llm_call
        keys_before:
          type: array
          items:
            type: string
          description: Top-level keys present in local_state before this step
          example: ["input", "proposed_scaffold", "created_tables"]
        keys_added:
          type: array
          items:
            type: string
          description: Top-level keys written to local_state by this step
          example: ["generated"]
        template_vars_resolved:
          type: object
          description: Template variable name → resolved value (truncated to 100 chars)
          additionalProperties:
            type: string
        template_vars_missing:
          type: array
          items:
            type: string
          description: Template variables that could not be resolved at this step
          example: ["confirmed_domain_help"]
        closest_match:
          type: string
          description: >
            When template_vars_missing is non-empty, the nearest key in local_state
            by edit distance. Advisory — shown to user in the review gate.
          example: "generated.domainHelp"
        status:
          type: string
          enum: [ok, failed, skipped]

    SimulationPathResult:
      type: object
      properties:
        path_name:
          type: string
          example: happy_path
        passed:
          type: boolean
        steps_executed:
          type: integer
          example: 11
        terminal:
          type: string
          description: The step key or terminal state the path actually reached
          example: end
        expected_terminal:
          type: string
          example: end
        failure_step:
          type: string
          description: Step key where the path failed. Present only when passed=false.
          example: "8"
        failure_reason:
          type: string
          description: Human-readable failure description. Present only when passed=false.
          example: "Template variable 'confirmed_domain_help' not found in local_state"
        local_state_transitions:
          type: array
          items:
            $ref: '#/components/schemas/SimulationStepTransition'

    StaticAnalysisIssue:
      type: object
      description: A single Level 1 static analysis failure
      required: [check, step, failure_class, detail]
      properties:
        check:
          type: string
          description: Which static analysis rule fired
          example: unresolved_template_variable
        step:
          type: string
          description: Step key where the issue was detected
          example: "8"
        failure_class:
          type: string
          enum:
            - unknown_routing_value
            - dead_routing_target
            - unresolved_template_variable
            - iterator_source_not_array
            - unknown_prompt_reference
            - gate_output_key_invalid
            - missing_cancel_option
        detail:
          type: string
          description: Specific description of the issue including key names involved
          example: "Template variable 'confirmed_domain_help' not found in local_state at step 8. Available keys: input, proposed_scaffold, generated"
        suggestion:
          type: string
          description: >
            Advisory correction hint. For unresolved_template_variable, the nearest
            key in local_state by edit distance at the point of failure.
          example: "Did you mean '{{generated.domainHelp}}'?"

    SkipPathWarning:
      type: object
      description: >
        Reserved schema — Level 3 skip-path analysis has been removed.
      properties:
        step:
          type: string
          description: Reserved — no longer populated
          example: "6"
        downstream_step:
          type: string
          description: The step that reads the null output_key if step is skipped
          example: "8"
        missing_key:
          type: string
          description: The output_key that would be null if step is skipped
          example: "generated"
        detail:
          type: string
          example: "Step 8 reads {{generated.domainHelp}} but step 6 is skippable. If step 6 is skipped, 'generated' will be null."

    SimulateWorkflowRequest:
      type: object
      description: >
        Request body for POST /api/v1/proc/simulate-workflow.
        Accepts the workflow step array, mock outputs, and simulation paths directly
        without requiring a WorkflowRun. Used for developer testing and by the
        simulate step type during create_workflow execution.
      required: [steps, simulationPaths]
      properties:
        steps:
          type: array
          minItems: 1
          description: The workflow step array to simulate
          items:
            type: object
        mockOutputs:
          type: object
          description: >
            Mock outputs keyed by step number (string). Required for any path that
            reaches an llm_call or serv_query step with outcome=success.
            Steps that are pure side-effects (serv_insert, notify, end) do not need mocks.
          additionalProperties: true
          example:
            "1": { domain: "recipes", tables: [] }
            "6": { domainHelp: { domain: "recipes", aliases: ["recipe"] }, workflows: [] }
        simulationPaths:
          type: array
          minItems: 1
          description: >
            Named execution paths to simulate. Must include at minimum:
            one happy path, one cancel path per gate step, and one failure path
            per llm_call or serv_* step. The output_schema for generate_workflow_paths
            enforces this minimum coverage.
          items:
            $ref: '#/components/schemas/SimulationPath'
        runInput:
          type: object
          description: >
            Simulated run.input — the original user input available as {{input.*}}
            in templates during simulation. Defaults to {} if omitted.
          example:
            userInput: "weekly portfolio summary"
        traceId:
          type: string
          format: uuid

    SimulateWorkflowResponse:
      type: object
      properties:
        passed:
          type: boolean
          description: True only if all paths passed all three validation levels
        pathsRun:
          type: integer
          example: 3
        pathsPassed:
          type: integer
          example: 3
        pathsFailed:
          type: integer
          example: 0
        staticAnalysis:
          type: object
          properties:
            passed:
              type: boolean
            issues:
              type: array
              items:
                $ref: '#/components/schemas/StaticAnalysisIssue'
        pathResults:
          type: array
          items:
            $ref: '#/components/schemas/SimulationPathResult'
        skipPathWarnings:
          type: array
          items:
            $ref: '#/components/schemas/SkipPathWarning'
          description: Advisory warnings from Level 3 skip-path analysis. Non-empty does not fail the simulation.
        traceId:
          type: string
          format: uuid

    ReviewOutputResponse:
      type: object
      properties:
        valid:
          type: boolean
        intentCategory:
          type: string
        attempt:
          type: integer
          description: Which attempt produced a valid result (1 or 2)
        correctedOutput:
          type: object
          description: Present only when attempt 2 succeeded — the LLM-corrected output
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorDetail'
          description: Ajv errors from the failed attempt — present only when valid is false
        errorLogged:
          type: boolean
          description: Whether the failure was written to PGC_Prompt.error_log
        traceId:
          type: string
          format: uuid

    ReferencedEntity:
      type: object
      description: >
        An entity from session context identified as relevant to the classified intent.
        Returned by Tier 2 classification when session context is available (Phase 3).
        Used to pre-seed local_state.context in the enqueued workflow run.
      properties:
        entity:
          type: string
          description: PGC_EntitySchema.entity_name
          example: Recipe
        id:
          type: integer
          description: PGC entity primary key — null if not yet persisted
          example: 42
        name:
          type: string
          description: Human-readable identifier for context — e.g. recipe name
          example: Carbonara

    ClassifyIntentRequest:
      type: object
      required: [userInput]
      properties:
        userInput:
          type: string
          description: Free-form natural language input from the user
          example: show me my pasta recipes
        sessionId:
          type: string
          description: >
            PGC_Session.session_id UUID. Present when the request arrived via
            /mind in an existing thread. Omit on fresh /mind calls and direct
            HTTP test calls. When present, classify-intent reads recent
            PGC_SessionEntry rows for context injection into Pass 2 domain
            fallback and Tier 2 sonar prompt (Phase 3).
          format: uuid
        callback:
          $ref: '#/components/schemas/Callback'
        traceId:
          type: string
          format: uuid

    ClassifyIntentResponse:
      type: object
      properties:
        intent_category:
          type: string
          description: Classified intent category
          example: get_recipes
        action_type:
          type: string
          enum: [crud, workflow, heavy_lift, crud_ambiguous]
          description: >
            workflow       — a named PGC_Workflow was matched. handoff() creates
                             PGC_WorkflowRun and enqueues WORKFLOW_STEP execute_top.
            heavy_lift     — requires LLM-driven workflow or domain creation.
            crud           — direct table operation via serv/table/*. ad_hoc_step is set.
            crud_ambiguous — intent identified but cannot execute without more information
                             (missing verb, missing id, missing field values). Instructive
                             error posted to user. No DB operation performed.
        confidence:
          type: string
          enum: [exact, keyword_match, semantic_match, crud, llm_classified, heavy_lift]
          description: >
            exact          — Pass 1 PGC_IntentMap regex matched. Zero LLM cost.
            keyword_match  — Pass 2 PGC_Workflow.intent_keywords token scan matched. Zero LLM cost.
            semantic_match — Pass 2 pgvector cosine similarity matched PGC_DomainHelp.embedding.
                             Zero LLM cost. Falls through to keyword scan for workflow selection.
            crud           — Pass 2 CRUD fallback for PGC_/PGD_-prefixed table input. Zero LLM cost.
            llm_classified — Tier 2 sonar call produced the classification.
            heavy_lift     — Tier 3 routed to create_domain or create_workflow.
        workflow_name:
          type: string
          description: >
            PGC_Workflow.name when action_type is workflow — null for all other action types.
            handoff() looks up this workflow by name to create PGC_WorkflowRun.
          example: get_recipes
        domain:
          type: string
          description: >
            Resolved domain name. Set when action_type is crud or crud_ambiguous (direct table
            path). Null when action_type is workflow or heavy_lift — handoff() does not need it.
          example: recipes
        search_term:
          type: string
          nullable: true
          description: >
            Extracted search string for retrieval workflows (get_*, search_*).
            Set by Pass 1 extractSearchTerm() or Pass 2 matchWorkflowByKeywords()
            when the matched workflow is a retrieval type and extra tokens follow
            the verb and domain name. Passed as input.search to PGC_WorkflowRun —
            the workflow step uses {{input.search}} as its filter value.
            Null for all non-retrieval workflows and all non-workflow action types.
          example: sweet potato chili
        ad_hoc_step:
          type: object
          description: >
            Direct table operation step built for PGC_/PGD_-prefixed table input.
            Set when action_type is crud. Executed immediately by executeCrudStep()
            in classify-intent.mjs — no PGC_WorkflowRun is created.
            Null for all other action types.
          example:
            type: serv_query
            input:
              tableName: PGD_Recipes
              filters: [{ column: name, op: like, value: "%pasta%" }]
        referenced_entities:
          type: array
          description: >
            Phase 3 — entities from session context identified as relevant
            to this classification by Tier 2. Used to pre-seed local_state.context
            in the enqueued workflow run. Null or absent when no session context
            is available or no entities were identified.
          items:
            $ref: '#/components/schemas/ReferencedEntity'
        traceId:
          type: string
          format: uuid

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # ── UI / Slackbot ──────────────────────────────────────────────────────────
  /api/v1/ui/slack/ping:
    post:
      summary: Unified ping — validates the requested layer of the stack
      description: |
        Exempt from Slack signature verification — all types are curl-accessible.

        **Usage (Slack):** `/ping [type]` — defaults to `api`
        **Usage (curl):** `curl -X POST .../ui/slack/ping -d "text=sqs&user_id=U1&channel_id=C1"`

        **Synchronous types** — response returned immediately:
        - `api` — SlackbotFunction alive check (no downstream calls)
        - `llm` — exp → proc (HTTP) → Perplexity → response
        - `db`  — exp → proc (HTTP) → serv → RDS → response

        **Async types** — ACK posted to Slack thread; result arrives via SQS callback:
        - `sqs`  — validates SQS round-trip: Slackbot → SQS → Proc → SQS → Callback
        - `e2e`  — validates full stack: Slackbot → SQS → Proc → Serv → SQS → Callback
        - `core` — launches ping_core integration test workflow (interactive Slack dialogs)
      tags: [ui-ping]
      requestBody:
        description: Slack slash command form payload (application/x-www-form-urlencoded)
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: Ping type — one of api, sqs, llm, e2e, db, core
                  enum: [api, sqs, llm, e2e, db, core]
                  default: api
                user_id:
                  type: string
                  description: Slack user ID
                channel_id:
                  type: string
                  description: Slack channel ID (required for async types)
      responses:
        '200':
          description: |
            Synchronous types (api, llm, db): JSON result body.
            Async types (sqs, e2e, core): empty body — ACK posted to Slack, result follows in thread.
          content:
            application/json:
              schema:
                oneOf:
                  - description: Synchronous ping result
                    type: object
                    properties:
                      success:
                        type: boolean
                      message:
                        type: string
                      traceId:
                        type: string
                      timestamp:
                        type: string
                        format: date-time
                  - description: Async ping — empty body (ACK posted to Slack)
                    type: string
                    example: ''
        '405':
          description: Method not allowed — ping-api expects POST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/ui/slack/shutdown:
    post:
      summary: Slack /shutdown command handler
      description: >
        Handles the /shutdown Slack slash command. Synchronous — unlike other
        slash commands, this does NOT enqueue to SQS. SlackbotFunction calls
        POST /proc/shutdown directly via HTTP fetch and returns the result
        inline within Slack's 3s response window.

        Slack command syntax:
          /shutdown            — cancel all active workflow runs
          /shutdown <runId>    — cancel a specific run by PGC_WorkflowRun.id

        Flow:
          1. Slack POSTs to this endpoint
          2. SlackbotFunction verifies Slack signing secret
          3. Parses text field — empty = cancel all, integer = cancel specific run
          4. Calls POST /proc/shutdown synchronously via HTTP fetch to PROC_API_URL
          5. Formats ShutdownResult as a Slack message and returns inline (response_type: ephemeral)
          6. No SQS enqueue, no thread — response is immediate and visible only to the caller

        Ephemeral response — only the user who ran /shutdown sees the result.
        This is intentional: shutdown is an operator action, not a team notification.
      tags: [UI-Slack]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [command, text, user_id, channel_id]
              properties:
                command:
                  type: string
                  example: /shutdown
                text:
                  type: string
                  description: Empty string (cancel all) or integer runId (cancel specific)
                  example: "42"
                user_id:
                  type: string
                  example: U012AB3CD
                channel_id:
                  type: string
                  example: C0AEJ87JSKF
      responses:
        '200':
          description: >
            Shutdown result returned inline. cancelledCount: 0 when no active runs exist —
            this is not an error.
          content:
            application/json:
              examples:
                runs_cancelled:
                  summary: One or more runs cancelled
                  value:
                    response_type: ephemeral
                    text: "🛑 Shutdown complete — 2 run(s) cancelled: create_domain (run 42), create_domain (run 43)"
                no_active_runs:
                  summary: No active workflows
                  value:
                    response_type: ephemeral
                    text: "✅ No active workflows to cancel"
                specific_run_cancelled:
                  summary: Specific run cancelled
                  value:
                    response_type: ephemeral
                    text: "🛑 Run 42 cancelled (create_domain, was at step 3)"
                specific_run_not_found:
                  summary: Specific run not found or already inactive
                  value:
                    response_type: ephemeral
                    text: "✅ Run 42 is not active (already completed, cancelled, or not found)"
        '400':
          description: Invalid Slack signature or text is not a valid integer when provided
        '500':
          description: PROC /shutdown call failed or timed out

